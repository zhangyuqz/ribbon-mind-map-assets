                "type": "heading",
                "level": 3,
                "text": "1. 设计步骤（演示子项编号 (1)(2)(3)）"
              },
              {
                "type": "ordered_list",
                "child_format": "(1)",
                "items": [
                  "确定故事主题，先画出封面、场景和人物的缩略草图",
                  {
                    "text": "拆分页面层次",
                    "children": [
                      "把远景、中景和前景分别画在三张描图纸上",
                      "为每个活动部件预留粘贴翼和开合空间"
                    ]
                  },
                  "制作一页白模，确认开合顺畅后再转绘到彩色卡纸"
                ]
              },
              {
                "type": "heading",
                "level": 3,
                "text": "2. 结构练习（演示子项编号 ①②③）"
              },
              {
                "type": "ordered_list",
                "child_format": "①",
                "items": [
                  "平行折：让主体随书页打开向前弹出",
                  {
                    "text": "V 形折：让主体形成有方向感的立体角度",
                    "children": [
                      "先确定 V 形中心线与书脊垂直",
                      "再让两侧粘贴翼保持相同宽度"
                    ]
                  },
                  "转轴结构：用纸铆钉让角色手臂或指针旋转"
                ]
              },
              {
                "type": "heading",
                "level": 3,
                "text": "3. 工具安全（演示子项编号 a.b.c.）"
              },
              {
                "type": "ordered_list",
                "child_format": "a",
                "items": [
                  "裁切时垫好切割垫，刀刃始终朝身体外侧移动",
                  {
                    "text": "使用金属直尺辅助切割",
                    "children": [
                      "手指压在直尺凹槽内，不跨过裁切边",
                      "一次轻划定位，再分次加深，不用蛮力"
                    ]
                  },
                  "停用刀具时立即收回刀片，并把碎纸清入回收盒"
                ]
              },

            en_US: 'How the image slots below work: each box takes an image LIST, not a single image or other file type. Image slot 1 is slot1, Image slot 2 is slot2, and so on. In the JSON: slot1 = all images in the list, slot1.1 = the 1st image in slot1, slot1.2 = the 2nd, slot1.filename = the image in slot1 whose filename is filename; slot2, slot3, … work the same way; a bare 1 or filename defaults to the 1st image or the matching filename in slot1. This field only shows this note — it is not read and can be left empty.'

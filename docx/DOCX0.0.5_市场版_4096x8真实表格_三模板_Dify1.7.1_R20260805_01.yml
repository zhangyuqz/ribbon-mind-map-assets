  \"type\": \"paragraph\",\n      \"runs\": [\n        {\n          \"text\": \"阅读提示：动手前请先查看\"\n        },\n        {\n          \"text\": \"《刀具安全与桌面保护》\",\n          \"font\": \"黑体\",\n          \"font_ascii\": \"Arial\",\n          \"size\": \"小三\",\n          \"color\": \"C00000\",\n          \"char_scale\": 90\n        },\n        {\n          \"text\": \"一节\"\n        },\n        {\n          \"text\": \"*\",\n          \"superscript\": true\n        },\n        {\n          \"text\": \"，未成年人应在成人陪同下使用美工刀。\"\n        }\n      ],\n      \"style\": {\n        \"indent_first\": 0,\n        \"space_before\": 3,\n        \"space_after\": 3,\n        \"keep_together\": true\n      }\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 2,\n      \"text\": \"（一）学习目标\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 3,\n      \"text\": \"1. 设计步骤（演示子项编号 (1)(2)(3)）\"\n    },\n    {\n      \"type\": \"ordered_list\",\n      \"child_format\": \"(1)\",\n      \"items\": [\n        \"确定故事主题，先画出封面、场景和人物的缩略草图\",\n        {\n          \"text\": \"拆分页面层次\",\n          \"children\": [\n            \"把远景、中景和前景分别画在三张描图纸上\",\n            \"为每个活动部件预留粘贴翼和开合空间\"\n          ]\n        },\n        \"制作一页白模，确认开合顺畅后再转绘到彩色卡纸\"\n      ]\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 3,\n      \"text\": \"2. 结构练习（演示子项编号 ①②③）\"\n    },\n    {\n      \"type\": \"ordered_list\",\n      \"child_format\": \"①\",\n      \"items\": [\n        \"平行折：让主体随书页打开向前弹出\",\n        {\n          \"text\": \"V 形折：让主体形成有方向感的立体角度\",\n          \"children\": [\n            \"先确定 V 形中心线与书脊垂直\",\n            \"再让两侧粘贴翼保持相同宽度\"\n          ]\n        },\n        \"转轴结构：用纸铆钉让角色手臂或指针旋转\"\n      ]\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 3,\n      \"text\": \"3. 工具安全（演示子项编号 a.b.c.）\"\n    },\n    {\n      \"type\": \"ordered_list\",\n      \"child_format\": \"a\",\n      \"items\": [\n        \"裁切时垫好切割垫，刀刃始终朝身体外侧移动\",\n        {\n          \"text\": \"使用金属直尺辅助切割\",\n          \"children\": [\n            \"手指压在直尺凹槽内，不跨过裁切边\",\n            \"一次轻划定位，再分次加深，不用蛮力\"\n          ]\n        },\n        \"停用刀具时立即收回刀片，并把碎纸清入回收盒\"\n      ]\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 2,\n      \"text\": \"（二）材料与工具\"\n    },\n    {\n      \"type\": \"bullet_list\",\n      \"items\": [\n        \"200—250 g/㎡ 彩色卡纸与 120 g/㎡ 内页纸\",\n        {\n          \"text\": \"基础工具\",\n          \"children\": [\n            \"切割垫、金属直尺、美工刀和剪刀\",\n            \"压痕笔、铅笔、橡皮和白胶\"\n          ]\n        },\n        \"可选装饰：彩笔、贴纸、丝带和透明描图纸\"\n      ]\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"二、材料配备与进度\"\n    },\n    {\n      \"type\": \"table\",\n      \"caption\": \"一册六页立体书材料与进度表\",\n      \"header_rows\": 2,\n      \"rows\": [\n        [\n          {\n            \"text\": \"（成品尺寸：A5 横向，建议先完成一页白模）\",\n            \"colspan\": 4,\n            \"style\": {\n              \"bold\": true,\n              \"align\": \"center\",\n              \"shading\": \"DDEBF7\"\n            }\n          }\n        ],\n        [\n          {\n            \"text\": \"阶段\",\n            \"style\": {\n              \"bold\": true,\n              \"align\": \"center\"\n            }\n          },\n          {\n            \"text\": \"材料\",\n            \"style\": {\n              \"bold\": true,\n              \"align\": \"center\"\n            }\n          },\n          {\n            \"text\": \"参考用量\",\n            \"style\": {\n              \"bold\": true,\n              \"align\": \"center\"\n            }\n          },\n          {\n            \"text\": \"教学目的\",\n            \"style\": {\n              \"bold\": true,\n              \"align\": \"center\"\n            }\n          }\n        ],\n        [\n          {\n            \"text\": \"结构练习\",\n            \"rowspan\": 3,\n            \"style\": {\n              \"align\": \"center\"\n            }\n          },\n          \"白色练习纸\",\n          \"A4 纸 3 张\",\n          \"验证平行折、V 形折和转轴\"\n        ],\n        [\n          \"描图纸\",\n          \"A4 纸 2 张\",\n          \"分层转绘与定位\"\n        ],\n        [\n          \"可移胶带\",\n          \"1 卷\",\n          \"临时固定白模\"\n        ],\n        [\n          {\n            \"text\": \"成品制作\",\n            \"rowspan\": 2,\n            \"style\": {\n              \"align\": \"center\"\n            }\n          },\n          \"彩色卡纸\",\n          \"A4 纸 8 张\",\n          \"制作内页、场景与活动件\"\n        ],\n        [\n          \"中性白胶\",\n          \"约 20 mL\",\n          \"粘贴翼点胶，避免纸张起皱\"\n        ]\n      ]\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"三、结构路线图\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"下图用一张图片展示从主题构思到装订验收的完整路线；在 Dify 中只需把图片变量连接到 IMAGE_SLOT_1。\"\n    },\n    {\n      \"type\": \"image\",\n      \"src\": \"slot1\",\n      \"width_mm\": 120,\n      \"align\": \"center\",\n      \"caption\": \"纸艺立体书制作流程思维导图\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"四、课堂记录与复盘\"\n    },\n    {\n      \"type\": \"chart\",\n      \"chart_type\": \"bar\",\n      \"title\": \"三轮白模的结构通过数\",\n      \"categories\": [\n        \"第一轮\",\n        \"第二轮\",\n        \"第三轮\"\n      ],\n      \"series\": [\n        {\n          \"name\": \"通过结构\",\n          \"values\": [\n            3,\n            5,\n            7\n          ]\n        }\n      ],\n      \"caption\": \"白模迭代后通过开合测试的结构数量\",\n      \"width_mm\": 120\n    },\n    {\n      \"type\": \"chart\",\n      \"chart_type\": \"line\",\n      \"title\": \"三课时完成度变化\",\n      \"categories\": [\n        \"第1课时\",\n        \"第2课时\",\n        \"第3课时\"\n      ],\n      \"series\": [\n        {\n          \"name\": \"结构完成度\",\n          \"values\": [\n            25,\n            65,\n            100\n          ]\n        },\n        {\n          \"name\": \"装饰完成度\",\n          \"values\": [\n            10,\n            40,\n            90\n          ]\n        }\n      ],\n      \"caption\": \"结构制作与装饰制作的课程进度\",\n      \"width_mm\": 120\n    },\n    {\n      \"type\": \"chart\",\n      \"chart_type\": \"pie\",\n      \"title\": \"课堂时间分配\",\n      \"categories\": [\n        \"设计与白模\",\n        \"成品制作\",\n        \"装订与复盘\"\n      ],\n      \"series\": [\n        {\n          \"name\": \"占比\",\n          \"values\": [\n            35,\n            45,\n            20\n          ]\n        }\n      ],\n      \"caption\": \"三类教学活动的建议时间占比\",\n      \"width_mm\": 110\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"五、尺寸计算与排版\"\n    },\n    {\n      \"type\": \"equation\",\n      \"latex\": \"\\\\text{粘贴翼宽度} = \\\\frac{\\\\text{弹起高度}}{4} + 2\\\\text{ mm}\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"runs\": [\n        {\n          \"text\": \"初学者可取弹起高度 \"\n        },\n        {\n          \"latex\": \"h = 40\\\\text{ mm}\"\n        },\n        {\n          \"text\": \"；第 \"\n        },\n        {\n          \"text\": \"x\",\n          \"italic\": true\n        },\n        {\n          \"text\": \"i\",\n          \"subscript\": true\n        },\n        {\n          \"text\": \" 个活动件与书脊至少保持 8 mm 间距。延伸阅读可打开 \"\n        },\n        {\n          \"link\": \"https://www.example.com/paper-craft\",\n          \"text\": \"纸艺结构练习页\"\n        },\n        {\n          \"text\": \"。本课程英文代号 \"\n        },\n        {\n          \"text\": \"pop-up lab\",\n          \"small_caps\": true\n        },\n        {\n          \"text\": \"、验收状态 \"\n        },\n        {\n          \"text\": \"ready\",\n          \"all_caps\": true\n        },\n        {\n          \"text\": \"。\"\n        }\n      ]\n    },\n    {\n      \"type\": \"page_break\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"六、装订与验收\"\n    },\n    {\n      \"type\": \"textbox\",\n      \"border\": true,\n      \"width_mm\": 150,\n      \"blocks\": [\n        {\n          \"type\": \"paragraph\",\n          \"text\": \"操作提示：先从中间跨页向两侧逐页装订；每粘好一页，都要完全合拢并静置一分钟，再继续下一页。\"\n        }\n      ]\n    },\n    {\n      \"type\": \"paragraph\",\n      \"style\": {\n        \"shading\": \"FFF2CC\",\n        \"border\": true,\n        \"align\": \"center\",\n        \"space_before\": 6,\n        \"space_after\": 6\n      },\n      \"runs\": [\n        {\n          \"text\": \"安全第一：裁切时使用切割垫，刀刃始终朝外，停用即收刀\",\n          \"bold\": true,\n          \"color\": \"C00000\"\n        }\n      ]\n    },\n    {\n      \"type\": \"paragraph\",\n      \"style\": {\n        \"indent_left\": 2,\n        \"indent_right\": 2,\n        \"keep_with_next\": true\n      },\n      \"text\": \"验收前先慢速开合三次，观察活动件是否碰撞、粘贴翼是否翘起，并在发现问题时用铅笔标记位置。\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"style\": {\n        \"keep_together\": true\n      },\n      \"text\": \"合格作品应做到书页能自然摊开、合拢时无明显阻力、结构不超出书页边缘、胶痕不过量、标题与图像层次清晰。\"\n    },\n    {\n      \"type\": \"section_break\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"七、成果说明与附件\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"本手册既是纸艺立体书的课堂教程，也是 DOCX 生成器高级模式的完整教学示例；修改文字、数据与图片变量即可快速制作自己的课程文档。\"\n    },\n    {\n      \"type\": \"note\",\n      \"text\": \"建议保留一页白模和一份尺寸记录，便于下次复刻或改版。\"\n    },\n    {\n      \"type\": \"attachment_note\",\n      \"items\": [\n        \"纸艺立体结构练习图\",\n        \"材料领用与余料记录表\",\n        \"作品开合验收清单\"\n      ]\n    },\n    {\n      \"type\": \"signoff\",\n      \"org\": \"青芽手作课堂课程研发组\",\n      \"date\": \"2026年7月20日\"\n    },\n    {\n      \"type\": \"page_break\"\n    },\n    {\n      \"type\": \"attachment_label\",\n      \"number\": 1\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": \"title\",\n      \"text\": \"纸艺立体结构练习图使用说明\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"一、练习安排\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 2,\n      \"text\": \"（一）先做白模\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 3,\n      \"text\": \"1. 平行折练习\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 4,\n      \"text\": \"（1）确定折线\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 5,\n      \"text\": \"① 标记中心\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 6,\n      \"text\": \"a. 检查开合\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"沿中心线反复轻折两次，贴合前先把页面完全打开和合拢，确认弹起结构不会越过裁切边。\"\n    }\n  ]\n}"
          form: form
          human_description:
            en_US: 'Generate a Word document from JSON; the default JSON below is a complete example covering every feature — just edit it. You can insert variables right here: put the cursor where you want (usually inside a value''s quotes), press / , and a list of variables produced by upstream nodes appears for you to choose; the chosen variable is replaced with its actual content at run time. (A fixed built-in example is provided: run it as-is; its image placeholder uses slot1 - pass an image list to slot1 below and it will be picked up automatically.) Note: Dify 1.9.0 and later display real line breaks in plugin-provided default text as literal \n. If this makes the field hard to read, it is a Dify frontend display issue, not text inserted by this plugin. Download the Advanced JSON tutorial from the four links at the top of the Marketplace README, or open example_advanced_full.json after extracting the .difypkg, then paste it here to edit.'
            zh_Hans: 使用 json 生成一份 word 文档，以下默认 json 就是一份覆盖全部功能的完整示例，照着改即可。这里可以直接输入变量，按 / 键选变量即可。不懂变量怎么用？总之就是：某个值想取自上游节点，就把光标放进它的引号里、按 / 键，就有上游节点产生的变量给你选；这个变量在运行时会自动替换成实际内容。（自带一份固定示例：可直接运行体验；示例中的插图位使用 slot1——在下方 slot1 传入一个图片列表即可被自动取用。）提示：Dify 1.9.0 及更高版本会把插件预置默认文本中的真实换行显示为字面量 \n。若这使内容难以阅读，这是 Dify 前端的显示问题，不是本插件写入了 \n。请从本插件 Marketplace 说明页开头下载高级模式教学 JSON，或解压 .difypkg 后打开 example_advanced_full.json，再粘贴到这里编辑。
          label:
            en_US: Document JSON
            zh_Hans: 文档 JSON
          llm_description: 'A JSON string describing the document. Top-level keys: meta {title, author} (title also becomes the output filename), page {size, margin_mm:[top,right,bottom,left]}, default_style (global style), heading_styles {title/1/2/3/4/5/6: style}, footer {style, page_number:{format, with {n} as the page number placeholder}}, watermark {text, color, size (optional font size in pt, default 54; watermark shape auto-fits text length)}, toc {enabled, title, levels, auto_update (optional, default true: TOC entries are pre-filled and auto-update when the document opens; set false for manual field update)}, blocks (array of content blocks). Block types and fields: heading {level: title|1|2|3|4|5|6, text}; paragraph {text or runs, style}; ordered_list / bullet_list {items: each item is a string or {text, children:[strings]}, child_format picks the sub-item numbering: (1) | ① | a | bullet}; table {rows, caption (table title placed ABOVE the table, auto-numbered 表N), header_rows (number of top rows repeated on every page when the table spans pages; default 1, set 0 to disable), caption_label (optional, overrides the 表 prefix, e.g. Table  for English documents)} where each cell is a string or {text, colspan, rowspan, style} and cells covered by a colspan/rowspan merge are simply omitted from rows; image {src, width_mm, align, caption (figure title below the image, auto-numbered 图N; optional caption_label overrides the 图 prefix, e.g. Figure  for English documents)}; chart {chart_type: bar|line|pie, categories, series:[{name, values}], title, width_mm, caption, caption_label (optional, overrides the 图 prefix, e.g. Figure )}; equation {latex} (standalone centered editable formula); textbox {blocks: paragraph blocks only, text or plain-text runs with character styles, no formulas/links/footnotes inside; border, width_mm}; classification {level, period}; doc_number {text}; note {text}; attachment_note {items}; signoff {org, date, blank_before (optional, default 2)} renders the official sign-off block: blank lines below the body, the date right-indented four characters (so its last character sits at the fifth position from the right margin), and the issuing-org name automatically centred over the date per GB/T 9704-2012 7.3.5.1 - no manual indent math needed; page_break; section_break. Paragraph style keys: align, line_spacing (+line_spacing_rule), indent_first/indent_left/indent_right, space_before/space_after, shading, border, keep_together, keep_with_next, page_break_before. A {text} run may carry: bold, italic, color, strike, superscript, subscript, all_caps, small_caps, highlight, emphasis, font, font_ascii, size, footnote, and underline (true or a case-insensitive style name: single, words, double, dotted, thick, dash, dotDash, dotDotDash, wavy or wave, dottedHeavy, dashHeavy, dotDashHeavy, dotDotDashHeavy, dashLong, dashLongHeavy, wavyHeavy, wavyDouble). A {latex} run is an inline formula; {link, text} is a hyperlink. Images use src: slotN = all images in slot N; slotN.k = the k-th image; slotN.filename = match by filename (with extension matches the full name, without extension matches the stem); a bare number or bare filename defaults to slot1. There are 20 image slots (slot1-slot20). If an image cannot be found, a red notice plus a short how-to-insert help is written at its place. Six heading levels are supported: level can be title or 1-6; levels 4-6 ship with built-in styles and every level can be overridden via heading_styles; toc levels may be set up to 6. Bar and line charts automatically label each data point with its value; pie charts show percentages. Official-document extras: {"type": "attachment_label", "number": 2} renders the top-left attachment marker (bold HeiTi size three, flush left; omit number for a plain marker); attachment_note follows GB/T 9704 layout (marker only on the first line, items numbered, continuation lines hang-indented); a table may set "borders": false to render without any borders for letterhead/telegram-header layout; align additionally supports "distribute" to stretch characters across the full line width (agency names on letterheads). New in 0.0.3 as well: run-level "char_scale" (integer percent 1-600, OOXML w:w) squeezes or stretches character width while keeping height, the standard way real letterheads fit huge type; and the high-level block {"type": "telegram_header", "org": ..., "doc_class": ..., "ref_no": ..., "signer": ..., "level": ..., "time": ..., "unit": ..., "cc": ..., "title": ..., "body_in_table": true, "time_label": "发电时间", "unit_label": "承办单位"} renders a Word/WPS-compatible fax-telegram header using exact OOXML geometry and the standard two-paragraph gap between the letterhead and information frame. By default the title and every following block remain inside the final cross-page body cell; set body_in_table to false only for legacy outside-table flow. time_label and unit_label are optional. Bug fix: when a cell or heading uses a font size too large for an exact line spacing (inherited or explicit), the spacing is lifted automatically to reduce glyph clipping under the validated layout. The default value below is a complete example exercising every supported feature.'

      data:
        code: |
          def main() -> dict:
              import json

              # Build one header row plus 4,096 data rows: 4,097 rows by 8 columns in total.
              rows = [["序号", "批次", "类别", "项目", "指标A", "指标B", "状态", "备注"]]
              for row_number in range(1, 4097):
                  batch_number = ((row_number - 1) // 100) + 1
                  rows.append([
                      f"{row_number:04d}",
                      f"B{batch_number:03d}",
                      "T",
                      f"P{row_number:04d}",
                      "1",
                      "2",
                      "Y",
                      "",
                  ])

              # Use only fields implemented by the plugin's Advanced JSON schema and shipped notice example.
              document = {
                  "meta": {
                      "title": "关于报送2026年度业务信息的通知",
                      "author": "示范单位办公室",
                  },
                  "page": {
                      "size": "A4",
                      "margin_mm": [37, 26, 35, 28],
                  },
                  "default_style": {
                      "font": "仿宋_GB2312",
                      "font_ascii": "Times New Roman",
                      "size": "三号",
                      "line_spacing": 28,
                      "line_spacing_rule": "exactly",
                      "indent_first": 2,
                      "align": "justify",
                  },
                  "heading_styles": {
                      "title": {
                          "font": "方正小标宋简体",
                          "size": "二号",
                          "align": "center",
                          "line_spacing": 32,
                          "line_spacing_rule": "exactly",
                      },
                  },
                  "footer": {
                      "style": {"font": "宋体", "size": "四号"},
                      "page_number": {"format": "— {n} —"},
                  },
                  "blocks": [
                      # First page: a complete notice with title, addressee, body, attachment note, and sign-off.
                      {
                          "type": "heading",
                          "level": "title",
                          "text": "关于报送2026年度业务信息的通知",
                      },
                      {
                          "type": "paragraph",
                          "style": {"indent_first": 0},
                          "text": "各有关单位：",
                      },
                      {
                          "type": "paragraph",
                          "text": "为全面掌握2026年度业务开展情况，进一步做好资料汇总和后续工作安排，现就有关信息报送事项通知如下。",
                      },
                      {
                          "type": "paragraph",
                          "text": "请各单位按照附件表格所列项目逐项核对、如实填写，并于2026年8月20日前完成报送。填报过程中如需补充说明，可在备注栏中注明。",
                      },
                      {
                          "type": "attachment_note",
                          "items": ["2026年度业务信息汇总表"],
                      },
                      {
                          "type": "signoff",
                          "org": "示范单位办公室",
                          "date": "2026年8月11日",
                      },
                      # The referenced attachment starts on a new page and contains the ultra-long real table.
                      {"type": "page_break"},
                      {"type": "attachment_label"},
                      {
                          "type": "heading",
                          "level": "title",
                          "text": "2026年度业务信息汇总表",
                      },
                      {"type": "table", "header_rows": 1, "rows": rows},
                  ],
              }
              # Compact serialization preserves all text while leaving the maximum possible space for table rows.
              serialized = json.dumps(document, ensure_ascii=False, separators=(",", ":"))

              # Keep every Code output below Dify 1.7.1's default 80,000-character limit.
              return {
                  "json_part_1": serialized[:60000],
                  "json_part_2": serialized[60000:120000],
                  "json_part_3": serialized[120000:],
              }
        code_language: python3
        desc: 确定性构造一份完整通知及其4097行×8列超长表格附件，并将JSON拆成三个低于Dify 1.7.1单字符串上限的连续分片。

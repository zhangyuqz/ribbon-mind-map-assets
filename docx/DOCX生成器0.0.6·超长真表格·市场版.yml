n          \"text\": \"操作提示：先从中间跨页向两侧逐页装订；每粘好一页，都要完全合拢并静置一分钟，再继续下一页。\"\n        }\n      ]\n    },\n    {\n      \"type\": \"paragraph\",\n      \"style\": {\n        \"shading\": \"FFF2CC\",\n        \"border\": true,\n        \"align\": \"center\",\n        \"space_before\": 6,\n        \"space_after\": 6\n      },\n      \"runs\": [\n        {\n          \"text\": \"安全第一：裁切时使用切割垫，刀刃始终朝外，停用即收刀\",\n          \"bold\": true,\n          \"color\": \"C00000\"\n        }\n      ]\n    },\n    {\n      \"type\": \"paragraph\",\n      \"style\": {\n        \"indent_left\": 2,\n        \"indent_right\": 2,\n        \"keep_with_next\": true\n      },\n      \"text\": \"验收前先慢速开合三次，观察活动件是否碰撞、粘贴翼是否翘起，并在发现问题时用铅笔标记位置。\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"style\": {\n        \"keep_together\": true\n      },\n      \"text\": \"合格作品应做到书页能自然摊开、合拢时无明显阻力、结构不超出书页边缘、胶痕不过量、标题与图像层次清晰。\"\n    },\n    {\n      \"type\": \"section_break\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"七、成果说明与附件\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"本手册既是纸艺立体书的课堂教程，也是 DOCX 生成器高级模式的完整教学示例；修改文字、数据与图片变量即可快速制作自己的课程文档。\"\n    },\n    {\n      \"type\": \"note\",\n      \"text\": \"建议保留一页白模和一份尺寸记录，便于下次复刻或改版。\"\n    },\n    {\n      \"type\": \"attachment_note\",\n      \"items\": [\n        \"纸艺立体结构练习图\",\n        \"材料领用与余料记录表\",\n        \"作品开合验收清单\"\n      ]\n    },\n    {\n      \"type\": \"signoff\",\n      \"org\": \"青芽手作课堂课程研发组\",\n      \"date\": \"2026年7月20日\"\n    },\n    {\n      \"type\": \"page_break\"\n    },\n    {\n      \"type\": \"attachment_label\",\n      \"number\": 1\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": \"title\",\n      \"text\": \"纸艺立体结构练习图使用说明\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 1,\n      \"text\": \"一、练习安排\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 2,\n      \"text\": \"（一）先做白模\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 3,\n      \"text\": \"1. 平行折练习\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 4,\n      \"text\": \"（1）确定折线\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 5,\n      \"text\": \"① 标记中心\"\n    },\n    {\n      \"type\": \"heading\",\n      \"level\": 6,\n      \"text\": \"a. 检查开合\"\n    },\n    {\n      \"type\": \"paragraph\",\n      \"text\": \"沿中心线反复轻折两次，贴合前先把页面完全打开和合拢，确认弹起结构不会越过裁切边。\"\n    }\n  ]\n}"
          form: form
          human_description:
            en_US: 'Generate a Word document from JSON; the default JSON below is a complete example covering every feature — just edit it. You can insert variables right here: put the cursor where you want (usually inside a value''s quotes), press / , and a list of variables produced by upstream nodes appears for you to choose; the chosen variable is replaced with its actual content at run time. (A fixed built-in example is provided: run it as-is; its image placeholder uses slot1 - pass an image list to slot1 below and it will be picked up automatically.) Note: Dify 1.9.0 and later display real line breaks in plugin-provided default text as literal \n. If this makes the field hard to read, it is a Dify frontend display issue, not text inserted by this plugin. Download the Advanced JSON tutorial from the four links at the top of the Marketplace README, or open example_advanced_full.json after extracting the .difypkg, then paste it here to edit.'
            ja_JP: 'Generate a Word document from JSON; the default JSON below is a complete example covering every feature — just edit it. You can insert variables right here: put the cursor where you want (usually inside a value''s quotes), press / , and a list of variables produced by upstream nodes appears for you to choose; the chosen variable is replaced with its actual content at run time. (A fixed built-in example is provided: run it as-is; its image placeholder uses slot1 - pass an image list to slot1 below and it will be picked up automatically.) Note: Dify 1.9.0 and later display real line breaks in plugin-provided default text as literal \n. If this makes the field hard to read, it is a Dify frontend display issue, not text inserted by this plugin. Download the Advanced JSON tutorial from the four links at the top of the Marketplace README, or open example_advanced_full.json after extracting the .difypkg, then paste it here to edit.'

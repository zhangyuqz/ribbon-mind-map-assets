              or open example_advanced_full.json after extracting the .difypkg, then
              paste it here to edit.'
            pt_BR: 'Generate a Word document from JSON; the default JSON below is
              a complete example covering every feature — just edit it. You can insert
              variables right here: put the cursor where you want (usually inside
              a value''s quotes), press / , and a list of variables produced by upstream
              nodes appears for you to choose; the chosen variable is replaced with
              its actual content at run time. (A fixed built-in example is provided:
              run it as-is; its image placeholder uses slot1 - pass an image list
              to slot1 below and it will be picked up automatically.) Note: Dify 1.9.0
              and later display real line breaks in plugin-provided default text as
              literal \n. If this makes the field hard to read, it is a Dify frontend
              display issue, not text inserted by this plugin. Download the Advanced
              JSON tutorial from the four links at the top of the Marketplace README,
              or open example_advanced_full.json after extracting the .difypkg, then
              paste it here to edit.'
            zh_Hans: 使用 json 生成一份 word 文档，以下默认 json 就是一份覆盖全部功能的完整示例，照着改即可。这里可以直接输入变量，按
              / 键选变量即可。不懂变量怎么用？总之就是：某个值想取自上游节点，就把光标放进它的引号里、按 / 键，就有上游节点产生的变量给你选；这个变量在运行时会自动替换成实际内容。（自带一份固定示例：可直接运行体验；示例中的插图位使用
              slot1——在下方 slot1 传入一个图片列表即可被自动取用。）提示：Dify 1.9.0 及更高版本会把插件预置默认文本中的真实换行显示为字面量
              \n。若这使内容难以阅读，这是 Dify 前端的显示问题，不是本插件写入了 \n。请从本插件 Marketplace 说明页开头下载高级模式教学
              JSON，或解压 .difypkg 后打开 example_advanced_full.json，再粘贴到这里编辑。
          label:
            en_US: Document JSON
            ja_JP: Document JSON
            pt_BR: Document JSON
            zh_Hans: 文档 JSON
          llm_description: 'A JSON string describing the document. Top-level keys:
            meta {title, author} (title also becomes the output filename), page {size,
            margin_mm:[top,right,bottom,left]}, default_style (global style), heading_styles
            {title/1/2/3/4/5/6: style}, footer {style, page_number:{format, with {n}
            as the page number placeholder}}, watermark {text, color, size (optional
            font size in pt, default 54; watermark shape auto-fits text length)},
            toc {enabled, title, levels, auto_update (optional, default true: TOC
            entries are pre-filled and auto-update when the document opens; set false
            for manual field update)}, blocks (array of content blocks). Block types
            and fields: heading {level: title|1|2|3|4|5|6, text}; paragraph {text
            or runs, style}; ordered_list / bullet_list {items: each item is a string
            or {text, children:[strings]}, child_format picks the sub-item numbering:
            (1) | ① | a | bullet}; table {rows, caption (table title placed ABOVE
            the table, auto-numbered 表N), header_rows (number of top rows repeated
            on every page when the table spans pages; default 1, set 0 to disable),
            caption_label (optional, overrides the 表 prefix, e.g. Table  for English
            documents)} where each cell is a string or {text, colspan, rowspan, style}
            and cells covered by a colspan/rowspan merge are simply omitted from rows;
            image {src, width_mm, align, caption (figure title below the image, auto-numbered
            图N; optional caption_label overrides the 图 prefix, e.g. Figure  for English
            documents)}; chart {chart_type: bar|line|pie, categories, series:[{name,
            values}], title, width_mm, caption, caption_label (optional, overrides
            the 图 prefix, e.g. Figure )}; equation {latex} (standalone centered editable
            formula); textbox {blocks: paragraph blocks only, text or plain-text runs
            with character styles, no formulas/links/footnotes inside; border, width_mm};
            classification {level, period}; doc_number {text}; note {text}; attachment_note
            {items}; signoff {org, date, blank_before (optional, default 2)} renders
            the official sign-off block: blank lines below the body, the date right-indented
            four characters (so its last character sits at the fifth position from
            the right margin), and the issuing-org name automatically centred over
            the date per GB/T 9704-2012 7.3.5.1 - no manual indent math needed; page_break;
            section_break. Paragraph style keys: align, line_spacing (+line_spacing_rule),
            indent_first/indent_left/indent_right, space_before/space_after, shading,
            border, keep_together, keep_with_next, page_break_before. A {text} run
            may carry: bold, italic, color, strike, superscript, subscript, all_caps,
            small_caps, highlight, emphasis, font, font_ascii, size, footnote, and
            underline (true or a case-insensitive style name: single, words, double,
            dotted, thick, dash, dotDash, dotDotDash, wavy or wave, dottedHeavy, dashHeavy,
            dotDashHeavy, dotDotDashHeavy, dashLong, dashLongHeavy, wavyHeavy, wavyDouble).
            A {latex} run is an inline formula; {link, text} is a hyperlink. Images
            use src: slotN = all images in slot N; slotN.k = the k-th image; slotN.filename
            = match by filename (with extension matches the full name, without extension
            matches the stem); a bare number or bare filename defaults to slot1. There
            are 20 image slots (slot1-slot20). If an image cannot be found, a red
            notice plus a short how-to-insert help is written at its place. Six heading
            levels are supported: level can be title or 1-6; levels 4-6 ship with
            built-in styles and every level can be overridden via heading_styles;
            toc levels may be set up to 6. Bar and line charts automatically label
            each data point with its value; pie charts show percentages. Official-document
            extras: {"type": "attachment_label", "number": 2} renders the top-left
            attachment marker (bold HeiTi size three, flush left; omit number for
            a plain marker); attachment_note follows GB/T 9704 layout (marker only
            on the first line, items numbered, continuation lines hang-indented);
            a table may set "borders": false to render without any borders for letterhead/telegram-header
            layout; align additionally supports "distribute" to stretch characters
            across the full line width (agency names on letterheads). New in 0.0.3
            as well: run-level "char_scale" (integer percent 1-600, OOXML w:w) squeezes
            or stretches character width while keeping height, the standard way real
            letterheads fit huge type; and the high-level block {"type": "telegram_header",
            "org": ..., "doc_class": ..., "ref_no": ..., "signer": ..., "level": ...,
            "time": ..., "unit": ..., "cc": ..., "title": ..., "body_in_table": true,
            "time_label": "发电时间", "unit_label": "承办单位"} renders a Word/WPS-compatible
            fax-telegram header using exact OOXML geometry and the standard two-paragraph
            gap between the letterhead and information frame. By default the title
            and every following block remain inside the final cross-page body cell;
            set body_in_table to false only for legacy outside-table flow. time_label
            and unit_label are optional. Bug fix: when a cell or heading uses a font
            size too large for an exact line spacing (inherited or explicit), the
            spacing is lifted automatically to reduce glyph clipping under the validated
            layout. The default value below is a complete example exercising every
            supported feature.'

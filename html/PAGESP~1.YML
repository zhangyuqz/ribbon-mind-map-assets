        selected: false
        template: "\\'use strict\\';\n\nwindow.addEventListener(\\'DOMContentLoaded\\', function () {\n  var required = [\\'Chart\\', \\'ChartDataLabels\\', \\'dayjs\\', \\'d3\\', \\'ss\\', \\'Papa\\', \\'chroma\\', \\'Tabulator\\', \\'marked\\', \\'DOMPurify\\', \\'rough\\', \\'Sortable\\', \\'countUp\\', \\'tippy\\', \\'QRCodeStyling\\'];\n  var missing = required.filter(function (name) { return typeof window[name] === \\'undefined\\'; });\n  var status = document.getElementById(\\'live-status\\');\n  if (missing.length) {\n    status.textContent = \\'初始化失败：缺少离线库 \\' + missing.join(\\', \\');\n    status.dataset.state = \\'error\\';\n    throw new Error(status.textContent);\n  }\n\n  var csv = [\n    \\'id,name,category,year,completeness,years_owned,note\\',\n    \\'EX-01,巫女风格桌面手办,角色手办,2021,96,5,光照与取景完整\\',\n    \\'EX-02,结构化计算机经典读本,经典藏书,1999,88,17,书脊有岁月痕迹\\',\n    \\'EX-03,编程语言理论手册,技术藏书,2016,92,9,索引与批注齐全\\',\n    \\'EX-04,平面设计配色笔记,设计藏书,2023,84,3,收录六组展陈色板\\',\n    \\'EX-05,木制桌面抽屉收纳盒,桌面器物,2020,90,6,收纳数据线与书签\\',\n    \\'EX-06,首次独立展示纪念卡,纪念品,2018,98,8,记录书房布置节点\\'\n  ].join(\\'\\\\n\\');\n  var rows = Papa.parse(csv, {header: true, dynamicTyping: true, skipEmptyLines: true}).data;\n  var activeRows = rows.slice();\n  var colors = chroma.scale([\\'#78d7c5\\', \\'#f4b6d2\\', \\'#ffca73\\']).mode(\\'lab\\').colors(rows.length);\n\n  document.getElementById(\\'updated-at\\').textContent = \\'示例生成日期：\\' + dayjs(\\'2026-08-03\\').format(\\'YYYY 年 MM 月 DD 日\\');\n  new countUp.CountUp(\\'metric-items\\', rows.length, {duration: 0.9, useEasing: true}).start();\n  new countUp.CountUp(\\'metric-score\\', ss.mean(rows.map(function (row) { return row.completeness; })), {decimalPlaces: 1, suffix: \\'%\\', duration: 1.1}).start();\n  new countUp.CountUp(\\'metric-median\\', ss.median(rows.map(function (row) { return row.years_owned; })), {suffix: \\' 年\\', duration: 1.2}).start();\n\n  Chart.register(ChartDataLabels);\n  var chart = new Chart(document.getElementById(\\'collection-chart\\'), {\n    type: \\'bar\\',\n    data: {\n      labels: rows.map(function (row) { return row.name; }),\n      datasets: [{\n        label: \\'展陈完整度\\',\n        data: rows.map(function (row) { return row.completeness; }),\n        backgroundColor: colors,\n        borderRadius: 8\n      }]\n    },\n    options: {\n      responsive: true,\n      maintainAspectRatio: false,\n      scales: {\n        y: {beginAtZero: true, max: 100, grid: {color: \\'#ffffff16\\'}, ticks: {color: \\'#c6cde2\\'}},\n        x: {grid: {display: false}, ticks: {color: \\'#c6cde2\\', maxRotation: 0, callback: function (value) { var label = this.getLabelForValue(value); return label.length > 8 ? label.slice(0, 8) + \\'…\\' : label; }}}\n      },\n      plugins: {\n        legend: {labels: {color: \\'#edf2ff\\'}},\n        datalabels: {anchor: \\'end\\', align: \\'top\\', color: \\'#ffffff\\', formatter: function (value) { return value + \\'%\\'; }}\n      }\n    }\n  });\n\n  var table = new Tabulator(\\'#collection-table\\', {\n    data: rows,\n    layout: \\'fitColumns\\',\n    responsiveLayout: \\'collapse\\',\n    pagination: false,\n    columns: [\n      {title: \\'编号\\', field: \\'id\\', width: 90},\n      {title: \\'展品\\', field: \\'name\\', minWidth: 180},\n      {title: \\'分类\\', field: \\'category\\', width: 120, headerFilter: \\'input\\'},\n      {title: \\'收录年\\', field: \\'year\\', width: 100, sorter: \\'number\\'},\n      {title: \\'完整度\\', field: \\'completeness\\', width: 110, sorter: \\'number\\', formatter: function (cell) { return cell.getValue() + \\'%\\'; }},\n      {title: \\'说明\\', field: \\'note\\', minWidth: 190}\n    ]\n  });\n\n  function drawD3(data) {\n    var host = d3.select(\\'#d3-strip\\');\n    host.selectAll(\\'*\\').remove();\n    var width = Math.max(560, document.getElementById(\\'d3-strip\\').clientWidth - 24);\n    var height = 52;\n    var scale = d3.scaleLinear().domain([0, 100]).range([0, width - 165]);\n    var svg = host.append(\\'svg\\').attr(\\'viewBox\\', \\'0 0 \\' + width + \\' \\' + (height * data.length)).attr(\\'role\\', \\'img\\');\n    var row = svg.selectAll(\\'g\\').data(data).join(\\'g\\').attr(\\'transform\\', function (item, index) { return \\'translate(0,\\' + (index * height) + \\')\\'; });\n    row.append(\\'text\\').attr(\\'x\\', 0).attr(\\'y\\', 26).attr(\\'fill\\', \\'#c6cde2\\').text(function (item) { return item.id + \\' \\' + item.category; });\n    row.append(\\'rect\\').attr(\\'x\\', 150).attr(\\'y\\', 9).attr(\\'height\\', 24).attr(\\'rx\\', 7).attr(\\'width\\', function (item) { return scale(item.completeness); }).attr(\\'fill\\', function (item, index) { return colors[index % colors.length]; });\n    row.append(\\'text\\').attr(\\'x\\', function (item) { return 158 + scale(item.completeness); }).attr(\\'y\\', 27).attr(\\'fill\\', \\'#ffffff\\').text(function (item) { return item.completeness + \\'%\\'; });\n  }\n\n  function updateData(nextRows, message) {\n    activeRows = nextRows.slice();\n    table.setData(activeRows);\n    chart.data.labels = activeRows.map(function (row) { return row.name; });\n    chart.data.datasets[0].data = activeRows.map(function (row) { return row.completeness; });\n    chart.data.datasets[0].backgroundColor = activeRows.map(function (_, index) { return colors[index % colors.length]; });\n    chart.update();\n    drawD3(activeRows);\n    status.textContent = message + \\'；当前显示 \\' + activeRows.length + \\' 件展品。\\';\n  }\n\n  document.getElementById(\\'filter-vintage\\').addEventListener(\\'click\\', function () {\n    updateData(rows.filter(function (row) { return row.category === \\'经典藏书\\' || row.category === \\'纪念品\\'; }), \\'已应用“经典与纪念品”筛选\\');\n  });\n  document.getElementById(\\'reset-filter\\').addEventListener(\\'click\\', function () {\n    updateData(rows, \\'已恢复全部展品\\');\n  });\n\n  var markdown = [\n    \\'### 策展原则\\',\n    \\'\\',\n    \\'- 以上传图片作为视觉焦点，不发送到网络。\\',\n    \\'- 展品台账是固定合成数据，可在表格表头直接筛选。\\',\n    \\'- 拖动“参观顺序”会立即更新当前路线。\\',\n    \\'\\',\n    \\'`spec` 只负责编排；`code1` 保持不透明；`slot1` 在输出中变成本地 data 资源。\\'\n  ].join(\\'\\\\n\\');\n  document.getElementById(\\'curator-notes\\').innerHTML = DOMPurify.sanitize(marked.parse(markdown));\n\n  function updateOrder() {\n    var names = Array.from(document.querySelectorAll(\\'#visit-order li\\')).map(function (item) { return item.dataset.zone; });\n    document.getElementById(\\'order-result\\').textContent = \\'当前顺序：\\' + names.join(\\' → \\');\n  }\n  Sortable.create(document.getElementById(\\'visit-order\\'), {animation: 180, ghostClass: \\'drag-ghost\\', onEnd: updateOrder});\n\n  tippy(\\'#help-tip\\', {content: \\'试试筛选台账、拖动参观顺序，并查看图表同步变化。\\', placement: \\'bottom\\'});\n  new QRCodeStyling({width: 130, height: 130, type: \\'svg\\', data: \\'pagespec-offline://desktop-library/exhibit-2026\\', dotsOptions: {color: \\'#21162c\\', type: \\'rounded\\'}, cornersSquareOptions: {color: \\'#7d365a\\', type: \\'extra-rounded\\'}, backgroundOptions: {color: \\'#ffffff\\'}}).append(document.getElementById(\\'exhibit-qr\\'));\n\n  var roughCanvas = rough.canvas(document.getElementById(\\'room-sketch\\'));\n  roughCanvas.rectangle(38, 55, 280, 125, {stroke: \\'#7d365a\\', strokeWidth: 4, fill: \\'#f5b8d0\\', fillStyle: \\'hachure\\'});\n  roughCanvas.rectangle(390, 25, 220, 170, {stroke: \\'#2f7568\\', strokeWidth: 4, fill: \\'#a9f1dc\\', fillStyle: \\'cross-hatch\\'});\n  roughCanvas.circle(760, 108, 150, {stroke: \\'#b97821\\', strokeWidth: 4, fill: \\'#ffca73\\', fillStyle: \\'zigzag\\'});\n  roughCanvas.line(318, 116, 390, 108, {stroke: \\'#dfe5f5\\', strokeWidth: 3});\n  roughCanvas.line(610, 108, 685, 108, {stroke: \\'#dfe5f5\\', strokeWidth: 3});\n\n  drawD3(rows);\n  status.textContent = \\'已读取 \\' + rows.length + \\' 件合成展品；图片、图表、表格、拖拽与二维码均已离线就绪。\\';\n  document.documentElement.dataset.pagespecTeachingReady = \\'true\\';\n});\n\n"

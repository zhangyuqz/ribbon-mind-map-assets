        selected: false
        template: '{"entry":"index.html","libraries":["chart.js","chartjs-plugin-datalabels","dayjs","d3","simple-statistics","papaparse","chroma-js","tabulator-tables","marked","dompurify","roughjs","sortablejs","countup.js","tippy.js","qr-code-styling"],"files":{"index.html":{"text":"<!doctype html>\\n<html lang=\\"zh-CN\\">\\n<head>\\n  <meta charset=\\"utf-8\\">\\n  <meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\">\\n  <title>桌面手办与个人书房数字展陈</title>\\n  <link rel=\\"stylesheet\\" href=\\"styles/exhibit.css\\">\\n</head>\\n<body>\\n  <a class=\\"skip\\" href=\\"#main\\">跳到主内容</a>\\n  <header class=\\"hero\\">\\n    <div class=\\"hero-copy\\">\\n      <p class=\\"eyebrow\\">PAGESPEC 0.0.1 · 断网教学示例</p>\\n      <h1>桌面手办与个人书房数字展陈</h1>\\n      <p>一个固定、非敏感主题的单文件离线展页。上传的第一张图片来自 <code>slot1</code>，全部交互逻辑来自 <code>code1</code>。</p>\\n      <div class=\\"hero-actions\\">\\n        <button id=\\"filter-vintage\\" type=\\"button\\">只看经典与纪念品</button>\\n        <button id=\\"reset-filter\\" class=\\"secondary\\" type=\\"button\\">恢复全部</button>\\n        <button id=\\"help-tip\\" class=\\"secondary\\" type=\\"button\\">如何交互？</button>\\n      </div>\\n      <p id=\\"live-status\\" class=\\"status\\" role=\\"status\\" aria-live=\\"polite\\">正在初始化离线展陈……</p>\\n    </div>\\n    <figure class=\\"portrait-card\\">\\n      <img id=\\"exhibit-photo\\" src=\\"assets/exhibit-photo\\" alt=\\"用户上传的桌面手办或书房展品图片\\">\\n      <figcaption>图片插槽 <strong>slot1</strong> 已内联到本地文档</figcaption>\\n    </figure>\\n  </header>\\n\\n  <main id=\\"main\\" class=\\"layout\\">\\n    <section class=\\"panel metrics\\" aria-labelledby=\\"metrics-title\\">\\n      <div class=\\"section-heading\\">\\n        <div><p class=\\"kicker\\">收藏概览</p><h2 id=\\"metrics-title\\">本地数据摘要</h2></div>\\n        <p id=\\"updated-at\\" class=\\"muted\\"></p>\\n      </div>\\n      <div class=\\"metric-grid\\">\\n        <article><span id=\\"metric-items\\" class=\\"metric-value\\">0</span><span>件展品</span></article>\\n        <article><span id=\\"metric-score\\" class=\\"metric-value\\">0</span><span>平均展陈完整度</span></article>\\n        <article><span id=\\"metric-median\\" class=\\"metric-value\\">0</span><span>中位收藏年限</span></article>\\n      </div>\\n    </section>\\n\\n    <section class=\\"panel chart-panel\\" aria-labelledby=\\"chart-title\\">\\n      <div class=\\"section-heading\\">\\n        <div><p class=\\"kicker\\">主题分布</p><h2 id=\\"chart-title\\">展品完整度与收藏年限</h2></div>\\n        <span class=\\"badge\\">Chart.js + Datalabels</span>\\n      </div>\\n      <div class=\\"chart-wrap\\"><canvas id=\\"collection-chart\\" aria-label=\\"展品完整度柱状图\\"></canvas></div>\\n      <div id=\\"d3-strip\\" class=\\"d3-strip\\" aria-label=\\"D3 迷你完整度条形图\\"></div>\\n    </section>\\n\\n    <section class=\\"panel table-panel\\" aria-labelledby=\\"table-title\\">\\n      <div class=\\"section-heading\\">\\n        <div><p class=\\"kicker\\">可筛选台账</p><h2 id=\\"table-title\\">离线收藏目录</h2></div>\\n        <span class=\\"badge\\">Papa Parse + Tabulator</span>\\n      </div>\\n      <div id=\\"collection-table\\"></div>\\n    </section>\\n\\n    <section class=\\"panel notes-panel\\" aria-labelledby=\\"notes-title\\">\\n      <div class=\\"section-heading\\">\\n        <div><p class=\\"kicker\\">安全文本</p><h2 id=\\"notes-title\\">展陈说明</h2></div>\\n        <span class=\\"badge\\">Marked + DOMPurify</span>\\n      </div>\\n      <div id=\\"curator-notes\\" class=\\"prose\\"></div>\\n    </section>\\n\\n    <section class=\\"panel order-panel\\" aria-labelledby=\\"order-title\\">\\n      <div class=\\"section-heading\\">\\n        <div><p class=\\"kicker\\">拖拽策展</p><h2 id=\\"order-title\\">参观顺序</h2></div>\\n        <span class=\\"badge\\">SortableJS</span>\\n      </div>\\n      <ol id=\\"visit-order\\" class=\\"visit-order\\">\\n        <li data-zone=\\"手办区\\" tabindex=\\"0\\"><span class=\\"grip\\">☷</span>手办区：角色与造型</li>\\n        <li data-zone=\\"编程书架\\" tabindex=\\"0\\"><span class=\\"grip\\">☷</span>编程书架：算法与系统</li>\\n        <li data-zone=\\"设计书架\\" tabindex=\\"0\\"><span class=\\"grip\\">☷</span>设计书架：版式与色彩</li>\\n        <li data-zone=\\"纪念品区\\" tabindex=\\"0\\"><span class=\\"grip\\">☷</span>纪念品区：时间与故事</li>\\n      </ol>\\n      <p id=\\"order-result\\" class=\\"status\\">当前顺序：手办区 → 编程书架 → 设计书架 → 纪念品区</p>\\n    </section>\\n\\n    <section class=\\"panel qr-panel\\" aria-labelledby=\\"qr-title\\">\\n      <div><p class=\\"kicker\\">离线标识</p><h2 id=\\"qr-title\\">展陈编号二维码</h2><p>二维码只编码本地示例标识，不访问网络。</p></div>\\n      <div id=\\"exhibit-qr\\" class=\\"qr\\"></div>\\n    </section>\\n\\n    <section class=\\"panel sketch-panel\\" aria-labelledby=\\"sketch-title\\">\\n      <div class=\\"section-heading\\"><div><p class=\\"kicker\\">手绘气质</p><h2 id=\\"sketch-title\\">书房布局草图</h2></div><span class=\\"badge\\">Rough.js</span></div>\\n      <canvas id=\\"room-sketch\\" width=\\"960\\" height=\\"240\\" aria-label=\\"桌面与书架的手绘布局草图\\"></canvas>\\n    </section>\\n  </main>\\n\\n  <footer>固定教学主题 · 完全断网可读 · 数据与文案均为合成示例</footer>\\n  <script src=\\"scripts/app.js\\"></script>\\n</body>\\n</html>","loader":"html","mime":"text/html"},"styles/exhibit.css":{"text":"*{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}body{margin:0;background:#0d111b;color:#edf2ff;font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,\\"Segoe UI\\",sans-serif;background-image:radial-gradient(circle at 12% 8%,#31396466 0,transparent 30rem),radial-gradient(circle at 92% 18%,#743d5b55 0,transparent 28rem)}button{font:inherit}.skip{position:fixed;left:1rem;top:-4rem;z-index:20;background:#fff;color:#111;padding:.65rem 1rem;border-radius:.7rem}.skip:focus{top:1rem}.hero{max-width:1180px;margin:auto;padding:64px 28px 34px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:34px;align-items:center}.eyebrow,.kicker{margin:0 0 .4rem;text-transform:uppercase;letter-spacing:.14em;color:#f5b8d0;font-weight:800;font-size:.75rem}.hero h1{font-family:Georgia,\\"Noto Serif SC\\",serif;font-size:clamp(2.25rem,5vw,4.8rem);line-height:1.04;margin:.2rem 0 1rem;max-width:13ch}.hero p{max-width:64ch;color:#c6cde2}.portrait-card{margin:0;padding:14px;background:linear-gradient(145deg,#ffffff18,#ffffff05);border:1px solid #ffffff22;border-radius:26px;box-shadow:0 28px 75px #0007;transform:rotate(1.2deg)}.portrait-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#20283a}.portrait-card figcaption{padding:12px 4px 3px;color:#c6cde2;font-size:.85rem}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 12px}button{border:1px solid #f5b8d0;background:#f5b8d0;color:#24121a;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;transition:transform .18s,box-shadow .18s}button:hover,button:focus-visible{transform:translateY(-2px);box-shadow:0 8px 28px #f5b8d033;outline:2px solid #fff;outline-offset:2px}button.secondary{background:#151b2a;color:#edf2ff;border-color:#606b86}.layout{max-width:1180px;margin:auto;padding:0 28px 58px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.panel{grid-column:span 12;background:#141a29dd;border:1px solid #ffffff19;border-radius:22px;padding:24px;box-shadow:0 18px 55px #0004;overflow:hidden}.metrics{grid-column:span 12}.chart-panel,.table-panel{grid-column:span 12}.notes-panel,.order-panel{grid-column:span 6}.qr-panel{grid-column:span 4;display:flex;align-items:center;justify-content:space-between;gap:20px}.sketch-panel{grid-column:span 8}.section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.section-heading h2,.qr-panel h2{margin:.1rem 0;font-family:Georgia,\\"Noto Serif SC\\",serif;font-size:1.55rem}.muted{color:#8f99b4}.badge{font-size:.72rem;font-weight:800;color:#a9f1dc;background:#15342f;border:1px solid #2c7061;border-radius:999px;padding:5px 9px;white-space:nowrap}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric-grid article{display:flex;flex-direction:column;border-left:3px solid #f5b8d0;background:#0c1220;padding:18px;border-radius:12px}.metric-value{font:700 2.4rem/1 Georgia,serif;color:#fff;margin-bottom:8px}.chart-wrap{position:relative;height:330px}.d3-strip{margin-top:16px;min-height:74px;background:#0d1320;border-radius:14px;padding:12px}.tabulator{border:0!important;background:transparent!important}.prose{color:#cbd3e8}.prose h3{color:#fff}.prose code{color:#a9f1dc}.visit-order{list-style:none;padding:0;margin:0;display:grid;gap:9px}.visit-order li{background:#0d1320;border:1px solid #313a52;border-radius:12px;padding:12px 14px;cursor:grab}.visit-order li:active{cursor:grabbing}.grip{display:inline-block;margin-right:10px;color:#f5b8d0}.status{border-left:3px solid #a9f1dc;background:#0c1220;border-radius:10px;padding:10px 13px;color:#cbd3e8}.qr{background:#fff;border-radius:14px;padding:10px;min-width:150px;min-height:150px;display:grid;place-items:center}.qr svg,.qr canvas{max-width:130px!important;max-height:130px!important}.sketch-panel canvas{width:100%;height:auto;background:#f8f1e4;border-radius:14px}footer{padding:26px;text-align:center;color:#8791aa;border-top:1px solid #ffffff12}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:40px}.portrait-card{max-width:420px}.notes-panel,.order-panel,.qr-panel,.sketch-panel{grid-column:span 12}.metric-grid{grid-template-columns:1fr}.qr-panel{align-items:flex-start}.section-heading{flex-direction:column}.layout,.hero{padding-left:16px;padding-right:16px}.panel{padding:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}","loader":"css","mime":"text/css"},"scripts/app.js":{"code_ref":"code1","loader":"js","mime":"text/javascript"},"assets/exhibit-photo":{"slot":"slot1"}}}'

                "text": "<!doctype html>\\n<html lang=\\"zh-CN\\"><head><meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\">\\n<title>统一 files 主协议 · 多文件离线项目</title><link rel=\\"stylesheet\\" href=\\"styles/report.css\\">\\n<!-- pagespec:runtime --></head><body><main>\\n<section class=\\"panel\\"><header><img src=\\"assets/badge.svg\\" alt=\\"离线徽标\\" width=\\"160\\" height=\\"48\\"><div><h1>通用多文件前端项目教学</h1><p>本页展示官方功能单元、source/build/output 三阶段、HTML/JS/CSS 语法 marker、Document Realm、typed JSON、Base64、符号链接与目录的真实协作。</p></div></header></section>\\n<section class=\\"panel\\"><h2>Chart.js 展示区域</h2><div class=\\"chart\\"><canvas id=\\"case-chart\\"></canvas></div>\\n<div class=\\"controls\\"><button id=\\"toggle-data\\" type=\\"button\\">交互1：切换图表数据</button><button id=\\"toggle-theme\\" type=\\"button\\">交互2：切换页面主题</button><a href=\\"data/report.json\\" download=\\"report.json\\">下载 typed JSON 数据</a><a id=\\"open-print\\" href=\\"print.html\\">打开第二个 HTML 文件</a></div>\\n<p id=\\"status\\" role=\\"status\\" aria-live=\\"polite\\">正在初始化离线库……</p></section>\\n<section class=\\"panel\\"><h2>字段为什么存在</h2><p><code>entry</code> 选定主文档；<code>ids</code> 递归组合 canonical 单元；<code>at.output</code> 的固定合同决定阶段和语法上下文；<code>realm</code> 区分入口与第二个 HTML；符号链接让页面引用同一脚本而不复制内容。</p></section>\\n</main><script src=\\"scripts/app.latest.js\\"></script></body></html>",

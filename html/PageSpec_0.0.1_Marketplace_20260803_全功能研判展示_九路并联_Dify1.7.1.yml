              "scripts/app.js": {
                "text": "/* pagespec:dayjs-build */\\n(function () {\\n  'use strict';\\n  var labels = ['线索受理', '关系核验', '资金复核', '形成报告'];\\n  var first = [18, 31, 24, 42];\\n  var second = [26, 20, 37, 29];\\n  var chart = new Chart(document.getElementById('case-chart'), {\\n    type: 'bar',\\n    data: {labels: labels, datasets: [{label: '研判项', data: first, backgroundColor: '#38bdf8'}]},\\n    options: {responsive: true, maintainAspectRatio: false, animation: false}\\n  });\\n  var alternate = false;\\n  function status(message) {\\n    document.getElementById('status').textContent = message + ' · ' + dayjs('2026-08-01T12:00:00Z').format('YYYY-MM-DD HH:mm');\\n  }\\n  document.getElementById('toggle-data').addEventListener('click', function () {\\n    alternate = !alternate;\\n    chart.data.datasets[0].data = alternate ? second : first;\\n    chart.data.datasets[0].backgroundColor = alternate ? '#f59e0b' : '#38bdf8';\\n    chart.update();\\n    status('图表数据已切换，变化显示在正上方柱状图');\\n  });\\n  document.getElementById('toggle-theme').addEventListener('click', function () {\\n    document.body.classList.toggle('light');\\n    status('页面主题已切换，变化显示在整个页面');\\n  });\\n  document.getElementById('open-print').addEventListener('click', function (event) {\\n    event.preventDefault();\\n    var child = window.open('about:blank', '_blank');\\n    if (!child) {\\n      status('浏览器已拦截第二个 HTML 窗口');\\n      return;\\n    }\\n    try {\\n      var href = this.getAttribute('href');\\n      var comma = href.indexOf(',');\\n      var meta = href.slice(0, comma);\\n      if (comma < 0 || meta.indexOf('data:text/html') !== 0 || meta.indexOf(';base64') < 0) {\\n        throw new Error('第二个 HTML 未完成离线内联');\\n      }\\n      var binary = atob(href.slice(comma + 1));\\n      var bytes = new Uint8Array(binary.length);\\n      for (var index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);\\n      var html = new TextDecoder('utf-8', {fatal: true}).decode(bytes);\\n      child.document.open();\\n      child.document.write(html);\\n      child.document.close();\\n      status('第二个 HTML 已在新窗口打开');\\n    } catch (error) {\\n      child.close();\\n      status('第二个 HTML 打开失败：' + error.message);\\n    }\\n  });\\n  status('Chart.js 与 Day.js 已从插件内置库离线载入');\\n}());",

                "text": "/* pagespec:open-props-source */\\n*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e5edf8;font:16px/1.55 system-ui,sans-serif}main{max-width:980px;margin:32px auto;padding:0 20px}.panel{background:#111d2e;border:1px solid #28415f;border-radius:16px;padding:20px;margin:18px 0}header{display:flex;gap:16px;align-items:center}h1{margin:0}.chart{height:360px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}button,a{border:1px solid #60a5fa;border-radius:9px;padding:9px 13px;background:#172b46;color:#fff;text-decoration:none;cursor:pointer}#status{margin-top:12px;padding:10px;border-left:4px solid #fbbf24;background:#0b1728}.light{background:#eef6ff;color:#10213a}.light .panel{background:#fff;border-color:#9bb7d7}.light button,.light a{color:#10213a;background:#dbeafe}code{color:#fbbf24}",

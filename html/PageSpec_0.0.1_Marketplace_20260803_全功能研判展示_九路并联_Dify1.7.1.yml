        template: |-
          {
            "entry": "dashboard.html",
            "ids": {
              "#report-runtime": [
                "chart.js/runtime",
                "dayjs/runtime",
                "open-props/presentation"
              ]
            },
            "libraries": [
              "#report-runtime"
            ],
            "at": [
              {
                "id": "chart.js/runtime",
                "output": "script",
                "file": "dashboard.html",
                "realm": "document",
                "marker": "runtime"
              },
              {

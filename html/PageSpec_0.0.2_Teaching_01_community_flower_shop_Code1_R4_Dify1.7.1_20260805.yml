le=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"tldts\\" data-binding=\\"tldts\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>tldts</h3><span>7.4.9</span></div><p>使用 tldts 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"ua-parser-js\\" data-binding=\\"UAParser\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>ua-parser-js</h3><span>1.0.41</span></div><p>使用 ua-parser-js 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"validator\\" data-binding=\\"validator\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>validator</h3><span>13.15.35</span></div><p>使用 validator 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"wordcloud\\" data-binding=\\"WordCloud\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>wordcloud</h3><span>1.2.3</span></div><p>使用 wordcloud 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"zxcvbn\\" data-binding=\\"zxcvbn\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>zxcvbn</h3><span>4.4.2</span></div><p>使用 zxcvbn 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article></div></section>\\n<p class=\\"footer\\">社区花店四季经营与订阅看板 · 固定合成数据 · R4 教学修订版</p></main>\\n<script id=\\"theme-data\\" type=\\"application/json\\">{\\"theme\\":\\"社区花店四季经营与订阅看板\\",\\"records\\":[{\\"label\\":\\"玫瑰订阅\\",\\"value\\":36},{\\"label\\":\\"季节花束\\",\\"value\\":28},{\\"label\\":\\"绿植养护\\",\\"value\\":19}],\\"revision\\":\\"R4\\"}</script>\\n\\n<!-- pagespec:caller-script --><script src=\\"scripts/app.js\\"></script></body></html>","loader":"html","mime":"text/html"},"scripts/app.js":{"code_ref":"code1","loader":"js","mime":"text/javascript"}}}


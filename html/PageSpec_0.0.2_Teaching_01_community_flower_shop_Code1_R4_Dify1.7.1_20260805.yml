        selected: false
        template: "{% raw %}(function () {\n  \"use strict\";\n\n  // These independent sentinels prove both escape preservation and selection of the correct theme payload.\n  const __PAGESPEC_R4_TRANSPORT_SENTINEL__ = \"LF=\\\\n|CRLF=\\\\r\\\\n|SLASH=\\\\\\\\|SQUOTE=\\'|DQUOTE=\\\\\"|JINJA={{literal}}\";\n  const pagespecR4Theme01Canonical = \"PAGESPEC_R4_THEME_01_CANONICAL\";\n\n  // Theme 01 owns its full library inventory; no function or state is imported from another teaching workflow.\n  var flowerItems = [\n    { library: \"@antv/s2\", binding: \"S2\" },\n    { library: \"crypto-js\", binding: \"CryptoJS\" },\n    { library: \"dayjs\", binding: \"dayjs\" },\n    { library: \"decimal.js\", binding: \"Decimal\" },\n    { library: \"echarts\", binding: \"echarts\" },\n    { library: \"ipaddr.js\", binding: \"ipaddr\" },\n    { library: \"jwt-decode\", binding: \"jwt_decode\" },\n    { library: \"katex\", binding: \"katex\" },\n    { library: \"klinecharts\", binding: \"klinecharts\" },\n    { library: \"libphonenumber-js\", binding: \"libphonenumber\" },\n    { library: \"lightweight-charts\", binding: \"LightweightCharts\" },\n    { library: \"mathjs\", binding: \"math\" },\n    { library: \"pinyin-pro\", binding: \"pinyinPro\" },\n    { library: \"tabulator-tables\", binding: \"Tabulator\" },\n    { library: \"tldts\", binding: \"tldts\" },\n    { library: \"ua-parser-js\", binding: \"UAParser\" },\n    { library: \"validator\", binding: \"validator\" },\n    { library: \"wordcloud\", binding: \"WordCloud\" },\n    { library: \"zxcvbn\", binding: \"zxcvbn\" }\n  ];\n  var flowerAccent = \"#d946ef\";\n  var flowerData = JSON.parse(document.getElementById(\"theme-data\").textContent);\n  var flowerHost = document.getElementById(\"demo-host\");\n  var flowerStatus = document.getElementById(\"status\");\n  var flowerDispose = null;\n  var flowerRunQueue = Promise.resolve();\n  var flowerRunToken = 0;\n\n  // Resolve an explicitly declared browser binding without evaluating source text.\n  function flowerResolve(path) {\n    return String(path || \"\").split(\".\").filter(Boolean).reduce(function (value, key) {\n      return value == null ? undefined : value[key];\n    }, window);\n  }\n\n  // Produce a bounded, deterministic text proof from a real API result.\n  function flowerSummarize(value) {\n    try {\n      if (value == null) return String(value);\n      if (typeof value === \"string\") return value.slice(0, 260);\n      if (typeof value === \"number\" || typeof value === \"boolean\") return String(value);\n      if (Array.isArray(value)) return JSON.stringify(value.slice(0, 10));\n      return JSON.stringify(value, null, 0).slice(0, 260);\n    } catch (error) {\n      return Object.prototype.toString.call(value);\n    }\n  }\n\n  // Add a topic-specific flower-shop plot only when the selected library did not already render a visual artifact.\n  // Commit only the selected library's own DOM and semantic evidence.\n\n  // Commit both visible evidence and machine-verifiable postconditions for the selected library.\n  function flowerCommit(library, method, value) {\n    var result = document.createElement(\"div\");\n    result.className = \"demo-result\";\n    result.textContent = library + \" · 真实公开 API：\" + method + \" · 固定花店数据：\" + flowerData.records.map(function (row) {\n      return row.label + \"=\" + row.value;\n    }).join(\"、\") + \" · 结果：\" + flowerSummarize(value);\n    flowerHost.appendChild(result);\n    flowerHost.dataset.demoLibrary = library;\n    flowerHost.dataset.demoApi = method;\n    flowerHost.dataset.demoTheme = \"community-flower-shop\";\n  }\n\n  // Invoke one of the nineteen theme-owned adapters. Every branch calls a documented public API.\n  async function flowerInvoke(library, api) {\n    switch (library) {\n      case \"@antv/s2\": {\n        var s2Root = document.createElement(\"div\");\n        s2Root.style.cssText = \"width:min(100%,640px);min-width:0;height:230px\";\n        flowerHost.app
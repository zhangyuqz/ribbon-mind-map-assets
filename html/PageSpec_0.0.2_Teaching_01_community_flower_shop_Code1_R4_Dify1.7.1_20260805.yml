          {"entry":"index.html","build":"browser-ready","libraries":["@antv/s2","crypto-js","dayjs","decimal.js","echarts","ipaddr.js","jwt-decode","katex","klinecharts","libphonenumber-js","lightweight-charts","mathjs","pinyin-pro","tabulator-tables","tldts","ua-parser-js","validator","wordcloud","zxcvbn"],"files":{"index.html":{"text":"<!doctype html>\\n<html lang=\\"zh-CN\\"><head>\\n<meta charset=\\"utf-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\">\\n<meta http-equiv=\\"Content-Security-Policy\\" content=\\"default-src ''none''; script-src ''unsafe-inline'' data:; style-src ''unsafe-inline'' data:; img-src data: blob:; font-src data:; connect-src ''none''; worker-src ''none''; child-src ''none''; frame-src ''none''; object-src ''none''; base-uri ''none''; form-action ''none''\\">\\n<title>社区花店四季经营与订阅看板 · Code1 R4 离线教学</title>\\n<!-- pagespec:caller-style -->\\n<style>\\nhtml,body{width:100%!important;max-width:none!important;min-height:100%!important;margin:0!important;padding:0!important;background:#0b1120!important}\\n*,*::before,*::after{box-sizing:border-box}body{color:#edf2ff!important;font:15px/1.6 system-ui,-apple-system,\\"PingFang SC\\",\\"Microsoft YaHei\\",sans-serif!important}\\n#teaching-shell{width:100%;max-width:1180px;margin:0 auto;padding:28px 18px 60px}#teaching-shell header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}\\n#teaching-shell h1{margin:.1rem 0;font-size:clamp(1.8rem,4vw,3rem);font-style:normal}#teaching-shell h2{margin:0 0 10px;font-style:normal}#teaching-shell p{color:#bdc8df;max-width:none}\\n.panel{background:#141d31;border:1px solid #2f4266;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 15px 40px #0004}.badge{display:inline-block;border:1px solid #d946ef;border-radius:999px;padding:5px 10px;color:#fff;white-space:nowrap}\\n.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#0c1527;border-radius:12px;padding:14px}.metric strong{display:block;font-size:1.65rem;color:#fff}\\n#demo-host{min-height:250px;display:grid;place-items:center;align-content:center;gap:12px;overflow:auto;background:#0b1426;border-radius:12px;padding:16px;isolation:isolate}#demo-host>svg,#demo-host>canvas{max-width:100%;height:auto}#demo-host>*{min-width:0;max-width:100%}\\n.demo-evidence{width:min(100%,760px);display:grid;gap:12px}.demo-title{font-size:1.05rem;font-weight:800;color:#fff}.demo-result{padding:12px;border-radius:10px;background:#101d34;border-left:4px solid #d946ef;white-space:pre-wrap;word-break:break-word;min-width:0;max-width:100%;overflow-wrap:anywhere}\\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#0d172a;border:1px solid #273a5b;border-radius:14px;padding:14px;transition:.2s}.card.active{border-color:#d946ef;box-shadow:0 0 0 2px #d946ef55}.card.failed{border-color:#ef4444}\\n.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.card h3{font-size:1rem;margin:0;word-break:break-word}.card-head span{font-size:.75rem;color:#91a2c2}.card p{font-size:.84rem;min-height:46px;margin:8px 0}\\nbutton{border:1px solid #d946ef;background:#d946ef;color:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;font-weight:700}button:hover,button:focus-visible{filter:brightness(1.15);outline:2px solid #fff;outline-offset:2px}.card-status{font-size:.8rem;color:#a9f1dc;margin-left:8px;overflow-wrap:anywhere;word-break:break-word}\\n#status{border-left:3px solid #d946ef;padding:10px 12px;background:#0b1426;border-radius:8px;overflow-wrap:anywhere;word-break:break-word}.footer{color:#8392ad;text-align:center;margin-top:22px}\\n@media(max-width:640px){#teaching-shell header{display:block}.metrics{grid-template-columns:1fr}.cards{grid-template-columns:1fr}#demo-host{min-height:220px;padding:10px}}\\n</style></head><body><main id=\\"teaching-shell\\">\\n<header><div><span class=\\"badge\\">PAGESPEC 0.0.2 · Code1 R4 · 完全离线</span><h1>社区花店四季经营与订阅看板</h1><p>固定合成主题；每个按钮都会调用对应库的公开 API，并把方法、固定输入和可核验结果显示在主题演示区。</p></div><span class=\\"badge\\">19 个本主题库</span></header>\\n<section class=\\"panel metrics\\"><div class=\\"metric\\"><strong>19</strong>逻辑库</div><div class=\\"metric\\"><strong>0</strong>外部依赖</div><div class=\\"metric\\"><strong>Code1</strong>本地增强脚本</div></section>\\n<section class=\\"panel\\"><h2>主题演示区</h2><div id=\\"demo-host\\" aria-label=\\"主题演示结果\\"></div><p id=\\"status\\" role=\\"status\\" aria-live=\\"polite\\">正在运行首个真实演示……</p></section>\\n<section class=\\"panel\\"><h2>内置库能力清单</h2><p>绿色状态表示公开 API 调用和可见后置条件均通过；失败会保留错误摘要，不会伪报成功。</p><div class=\\"cards\\"><article class=\\"card\\" data-library=\\"@antv/s2\\" data-binding=\\"S2\\" data-style=\\"true\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>@antv/s2</h3><span>2.7.2</span></div><p>使用 @antv/s2 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"crypto-js\\" data-binding=\\"CryptoJS\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>crypto-js</h3><span>4.2.0</span></div><p>使用 crypto-js 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"dayjs\\" data-binding=\\"dayjs\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>dayjs</h3><span>1.11.21</span></div><p>使用 dayjs 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"decimal.js\\" data-binding=\\"Decimal\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>decimal.js</h3><span>10.6.0</span></div><p>使用 decimal.js 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"echarts\\" data-binding=\\"echarts\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>echarts</h3><span>6.1.0</span></div><p>使用 echarts 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"ipaddr.js\\" data-binding=\\"ipaddr\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>ipaddr.js</h3><span>2.4.0</span></div><p>使用 ipaddr.js 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"jwt-decode\\" data-binding=\\"jwt_decode\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>jwt-decode</h3><span>3.1.2</span></div><p>使用 jwt-decode 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"katex\\" data-binding=\\"katex\\" data-style=\\"true\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>katex</h3><span>0.18.1</span></div><p>使用 katex 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"klinecharts\\" data-binding=\\"klinecharts\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>klinecharts</h3><span>10.0.0</span></div><p>使用 klinecharts 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\
st().length, ticker: \"FLOWER-OFFLINE\" } };\n      }\n      case \"libphonenumber-js\": {\n        var phone = api.parsePhoneNumberFromString(\"+8613812345678\");\n        return { method: \"parsePhoneNumberFromString.formatInternational\", value: phone && phone.formatInternational() };\n      }\n      case \"lightweight-charts\": {\n        var lightweightRoot = document.createElement(\"div\");\n        lightweightRoot.style.cssText = \"width:min(100%,640px);min-width:0;height:230px\";\n        flowerHost.appendChild(lightweightRoot);\n        var lightweightChart = api.createChart(lightweightRoot, { width: Math.max(240, Math.min(640, flowerHost.clientWidth || 640)), height: 230, layout: { background: { type: \"solid\", color: \"#0b1528\" }, textColor: \"#dbe7ff\" } });\n        var lineSeries = lightweightChart.addSeries(api.LineSeries, { color: flowerAccent, lineWidth: 3 });\n        lineSeries.setData(flowerData.records.map(function (row, index) { return { time: \"2026-08-0\" + String(index + 1), value: Number(row.value) }; }));\n        lightweightChart.timeScale().fitContent();\n        await new Promise(function (resolve) { requestAnimationFrame(function () { requestAnimationFrame(resolve); }); });\n        flowerDispose = function () { lightweightChart.remove(); };\n        return { method: \"LightweightCharts.createChart.addSeries\", value: { canvases: lightweightRoot.querySelectorAll(\"canvas\").length, points: flowerData.records.length } };\n      }\n      case \"mathjs\":\n        return { method: \"math.mean\", value: api.mean(flowerData.records.map(function (row) { return row.value; })) };\n      case \"pinyin-pro\":\n        return { method: \"pinyinPro.pinyin\", value: api.pinyin(flowerData.theme, { toneType: \"none\" }) };\n      case \"tabulator-tables\": {\n        var tableRoot = document.createElement(\"div\");\n        tableRoot.style.cssText = \"width:100%;min-width:280px\";\n        flowerHost.appendChild(tableRoot);\n        var table = new api(tableRoot, { data: flowerData.records, layout: \"fitColumns\", columns: [{ title: \"标签\", field: \"label\" }, { title: \"数量\", field: \"value\" }] });\n        await new Promise(function (resolve) {\n          var settled = false;\n          var finish = function () { if (!settled) { settled = true; resolve(); } };\n          if (table && typeof table.on === \"function\") table.on(\"tableBuilt\", finish);\n          setTimeout(finish, 2000);\n        });\n        var rows = table && typeof table.getData === \"function\" ? table.getData().length : tableRoot.querySelectorAll(\".tabulator-row\").length;\n        if (rows !== flowerData.records.length) throw new Error(\"Tabulator 未完成初始化，期望行数 \" + flowerData.records.length + \"，实际 \" + rows);\n        flowerDispose = function () { table.destroy(); };\n        return { method: \"Tabulator.tableBuilt/getData\", value: { rows: rows, domRows: tableRoot.querySelectorAll(\".tabulator-row\").length } };\n      }\n      case \"tldts\":\n        return { method: \"tldts.parse\", value: api.parse(\"https://orders.flower.example.org/daily\") };\n      case \"ua-parser-js\":\n        return { method: \"UAParser.getBrowser\", value: new api(\"Mozilla/5.0 Chrome/109.0\").getBrowser() };\n      case \"validator\":\n        return { method: \"validator.isEmail\", value: api.isEmail(\"orders@flower.example.org\") };\n      case \"wordcloud\": {\n        var wordCloudCanvas = document.createElement(\"canvas\");\n        wordCloudCanvas.width = 620;\n        wordCloudCanvas.height = 220;\n        flowerHost.appendChild(wordCloudCanvas);\n        api(wordCloudCanvas, { list: flowerData.records.map(function (row) { return [row.label, Number(row.value)]; }), weightFactor: 3, backgroundColor: \"transparent\", color: flowerAccent });\n        return { method: \"WordCloud.canvas\", value: { words: flowerData.records.length, width: wordCloudCanvas.width } };\n      }\n      case \"zxcvbn\":\n        return { method: \"zxcvbn\", value: { scor
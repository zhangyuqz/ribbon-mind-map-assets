    - data:
        desc: 模板节点输出不透明 JavaScript；插件仅在收件人打开 HTML 时于本地浏览器执行。
        selected: false
        template: "{% raw %}(function () {\n  \"use strict\";\n\n  // These independent sentinels prove both escape preservation and selection of the correct theme payload.\n  const __PAGESPEC_R4_TRANSPORT_SENTINEL__ = \"LF=\\\\n|CRLF=\\\\r\\\\n|SLASH=\\\\\\\\|SQUOTE=\\'|DQUOTE=\\\\\"|JINJA={{literal}}\";\n  const pagespecR4Theme02Canonical = \"PAGESPEC_R4_THEME_02_CANONICAL\";\n\n  // Theme 02 owns all ten dashboard adapters and has no runtime dependency on another teaching script.\n  var libraryItems = [\n    { library: \"chart.js\", binding: \"Chart\" },\n    { library: \"chartjs-plugin-datalabels\", binding: \"ChartDataLabels\" },\n    { library: \"chartjs-plugin-zoom\", binding: \"ChartZoom\" },\n    { library: \"crossfilter2\", binding: \"crossfilter\" },\n    { library: \"d3\", binding: \"d3\" },\n    { library: \"dc\", binding: \"dc\" },\n    { library: \"echarts\", binding: \"echarts\" },\n    { library: \"hammerjs\", binding: \"Hammer\" },\n    { library: \"simple-statistics\", binding: \"ss\" },\n    { library: \"uplot\", binding: \"uPlot\" }\n  ];\n  var libraryAccent = \"#22c55e\";\n  var libraryData = JSON.parse(document.getElementById(\"theme-data\").textContent);\n  var libraryHost = document.getElementById(\"demo-host\");\n  var libraryStatus = document.getElementById(\"status\");\n  var libraryDispose = null;\n  var libraryRunQueue = Promise.resolve();\n  var libraryRunToken = 0;\n\n  // Resolve only the binding declared by this workflow; source text is never evaluated.\n  function libraryResolve(path) {\n    return String(path || \"\").split(\".\").filter(Boolean).reduce(function (value, key) {\n      return value == null ? undefined : value[key];\n    }, window);\n  }\n\n  // Bound arbitrary API output before displaying it in the fixed teaching shell.\n  function librarySummarize(value) {\n    try {\n      if (value == null) return String(value);\n      if (typeof value === \"string\") return value.slice(0, 260);\n      if (typeof value === \"number\" || typeof value === \"boolean\") return String(value);\n      if (Array.isArray(value)) return JSON.stringify(value.slice(0, 10));\n      return JSON.stringify(value).slice(0, 260);\n    } catch (error) {\n      return Object.prototype.toString.call(value);\n    }\n  }\n\n  // Render a public-library circulation plot when the selected adapter has no native canvas or SVG output.\n  // Publish only the selected library's own DOM and semantic evidence.\n\n  // Publish visible evidence and stable data attributes for the real-Dify BLOB audit.\n  function libraryCommit(name, method, value) {\n    var result = document.createElement(\"div\");\n    result.className = \"demo-result\";\n    result.textContent = name + \" · 真实公开 API：\" + method + \" · 固定借阅数据：\" + libraryData.records.map(function (row) {\n      return row.label + \"=\" + row.value;\n    }).join(\"、\") + \" · 结果：\" + librarySummarize(value);\n    libraryHost.appendChild(result);\n    libraryHost.dataset.demoLibrary = name;\n    libraryHost.dataset.demoApi = method;\n    libraryHost.dataset.demoTheme = \"public-library-lab\";\n  }\n\n  // Invoke one dedicated adapter for each of the ten theme-owned dashboard libraries.\n  async function libraryInvoke(name, api) {\n    switch (name) {\n      case \"chart.js\": {\n        var chartCanvas = document.createElement(\"canvas\");\n        chartCanvas.width = 640;\n        chartCanvas.height = 230;\n        libraryHost.appendChild(chartCanvas);\n        var chart = new api(chartCanvas.getContext(\"2d\"), {\n          type: \"line\",\n          data: {\n            labels: libraryData.records.map(function (row) { return row.label; }),\n            datasets: [{ label: \"借阅量\", data: libraryData.records.map(function (row) { return row.value; }), borderColor: libraryAccent, backgroundColor: \"rgba(34,197,94,.22)\" }]\n          },\n          options: { animation: false, responsive: false }\n        });\n        libraryDispose = function () { chart.destroy(); };\n        return { method: \"Chart.constructor.update\", value: { datasets: chart.data.datasets.length, points: chart.data.datasets[0].data.length } };\n      }\n      case \"chartjs-plugin-datalabels\":\n      case \"chartjs-plugin-zoom\": {\n        var pluginCanvas = document.createElement(\"canvas\");\n        pluginCanvas.width = 640;\n        pluginCanvas.height = 230;\n        libraryHost.appendChild(pluginCanvas);\n        var ChartConstructor = window.Chart;\n        ChartConstructor.register(api);\n        var registered = ChartConstructor.registry.plugins.get(api.id) === api;\n        if (!registered) throw new Error(\"Chart 插件未注册：\" + api.id);\n        var pluginOptions = api.id === \"datalabels\" ? { color: \"#f8fafc\", display: true } : { zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: \"x\" }, pan: { enabled: true, mode: \"x\" } };\n        var pluginChart = new ChartConstructor(pluginCanvas.getContext(\"2d\"), {\n          type: \"line\",\n          data: { labels: libraryData.records.map(function (row) { return row.label; }), datasets: [{ data: libraryData.records.map(function (row) { return row.value; }), borderColor: libraryAccent }] },\n          options: { animation: false, responsive: false, plugins: (function () { var result = {}; result[api.id] = pluginOptions; return result; }()) }\n        });\n        var attached = Boolean(pluginChart.config.options.plugins[api.id]) && pluginChart.getDatasetMeta(0).data.length === libraryData.records.length;\n        var zoomed = false;\n        if (api.id === \"zoom\" && typeof pluginChart.zoom === \"function\") { pluginChart.zoom(1.08); zoomed = true; }\n        if (!attached) throw new Error(\"Chart 插件未挂载到真实图表：\" + api.id);\n        libraryDispose = function () { try { pluginChart.destroy(); } finally { ChartConstructor.unregister(api); } };\n        return { method: \"Chart.register/new Chart/plugin options\", value: { plugin: api.id, registered: registered, attached: attached, zoomed: zoomed, canvas: pluginCanvas.width } };\n      }\n      case \"crossfilter2\": {\n        var crossfilter = api(libraryData.records);\n        var dimension = crossfilter.dimension(function (row) { return row.label; });\n        var groups = dimension.group().reduceSum(function (row) { return Number(row.value); }).all();\n        dimension.dispose();\n        return { method: \"crossfilter.dimension.group.reduceSum\", value: { size: crossfilter.size(), groups: groups } };\n      }\n      case \"d3\": {\n        var d3Svg = api.create(\"svg\").attr(\"viewBox\", \"0 0 640 220\").attr(\"aria-label\", \"D3 借阅量柱图\");\n        var scale = api.scaleLinear().domain([0, api.max(libraryData.records, function (row) { return Number(row.value); })]).range([0, 480]);\n        d3Svg.selectAll(\"rect\").data(libraryData.records).join(\"rect\").attr(\"x\", 80).attr(\"y\", function (row, index) { return 25 + index * 58; }).attr(\"height\", 36).attr(\"width\", function (row) { return scale(Number(row.value)); }).attr(\"fill\", libraryAccent);\n        libraryHost.appendChild(d3Svg.node());\n        return { method: \"d3.scaleLinear.selectAll.join\", value: { mean: api.mean(libraryData.records, function (row) { return Number(row.value); }), marks: d3Svg.selectAll(\"rect\").size() } };\n      }\n      case \"dc\": {\n        // DC 4.2 no longer exposes dc.units.ordinal; use the package\\'s proven numeric-domain contract.\n        var dcRows = libraryData.records.map(function (row, index) { return { index: index, label: row.label, value: Number(row.value) }; });\n        var dcCrossfilter = window.crossfilter(dcRows);\n        var dcDimension = dcCrossfilter.dimension(function (row) { return row.index; });\n        var dcGroup = dcDimension.group().reduceSum(function (row) { return Math.abs(row.value); });\n        var dcRoot = document.createElement(\"div\");\n        libraryHost.appendChild(dcRoot);\n        var dcChartGroup = \"pagespec-r4-public-library\";\n        var dcChart = api.barCh
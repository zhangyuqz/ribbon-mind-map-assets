    - data:
        desc: 模板节点输出不透明 JavaScript；插件仅在收件人打开 HTML 时于本地浏览器执行。
        selected: false
        template: "{% raw %}(function () {\n  \"use strict\";\n\n  // These independent sentinels prove both escape preservation and selection of the correct theme payload.\n  const __PAGESPEC_R4_TRANSPORT_SENTINEL__ = \"LF=\\\\n|CRLF=\\\\r\\\\n|SLASH=\\\\\\\\|SQUOTE=\\'|DQUOTE=\\\\\"|JINJA={{literal}}\";\n  const pagespecR4Theme03Canonical = \"PAGESPEC_R4_THEME_03_CANONICAL\";\n\n  // Theme 03 contains eight self-sufficient energy-dashboard adapters and imports no teaching helper.\n  var energyItems = [\n    { library: \"@observablehq/plot\", binding: \"Plot\" },\n    { library: \"chroma-js\", binding: \"chroma\" },\n    { library: \"d3\", binding: \"d3\" },\n    { library: \"echarts\", binding: \"echarts\" },\n    { library: \"gridstack\", binding: \"GridStack\" },\n    { library: \"simple-statistics\", binding: \"ss\" },\n    { library: \"vega\", binding: \"vega\" },\n    { library: \"vega-lite\", binding: \"vegaLite\" }\n  ];\n  var energyAccent = \"#f59e0b\";\n  var energyData = JSON.parse(document.getElementById(\"theme-data\").textContent);\n  var energyHost = document.getElementById(\"demo-host\");\n  var energyStatus = document.getElementById(\"status\");\n  var energyDispose = null;\n\n  // Resolve a declared global binding without dynamic compilation.\n  function energyResolve(path) {\n    return String(path || \"\").split(\".\").filter(Boolean).reduce(function (value, key) {\n      return value == null ? undefined : value[key];\n    }, window);\n  }\n\n  // Serialize only a bounded proof fragment so large library objects never enter the report text.\n  function energySummarize(value) {\n    try {\n      if (value == null) return String(value);\n      if (typeof value === \"string\") return value.slice(0, 260);\n      if (typeof value === \"number\" || typeof value === \"boolean\") return String(value);\n      if (Array.isArray(value)) return JSON.stringify(value.slice(0, 10));\n      return JSON.stringify(value).slice(0, 260);\n    } catch (error) {\n      return Object.prototype.toString.call(value);\n    }\n  }\n\n  // Add a deterministic energy-load chart only when a library has not produced its own visible output.\n  function energyAddFallbackPlot() {\n    if (energyHost.querySelector(\"canvas,svg,.grid-stack\")) return;\n    var svg = document.createElementNS(\"http://www.w3.org/2000/svg\", \"svg\");\n    svg.setAttribute(\"viewBox\", \"0 0 720 180\");\n    svg.setAttribute(\"aria-label\", \"家庭能耗固定数据图\");\n    energyData.records.forEach(function (row, index) {\n      var radius = 24 + Math.min(38, Number(row.value));\n      var circle = document.createElementNS(\"http://www.w3.org/2000/svg\", \"circle\");\n      circle.setAttribute(\"cx\", String(130 + index * 225));\n      circle.setAttribute(\"cy\", \"82\");\n      circle.setAttribute(\"r\", String(radius));\n      circle.setAttribute(\"fill\", energyAccent);\n      circle.setAttribute(\"fill-opacity\", String(0.35 + index * 0.18));\n      svg.appendChild(circle);\n      var label = document.createElementNS(\"http://www.w3.org/2000/svg\", \"text\");\n      label.setAttribute(\"x\", String(130 + index * 225));\n      label.setAttribute(\"y\", \"162\");\n      label.setAttribute(\"text-anchor\", \"middle\");\n      label.setAttribute(\"fill\", \"#dbe7ff\");\n      label.textContent = String(row.label);\n      svg.appendChild(label);\n    });\n    energyHost.appendChild(svg);\n  }\n\n  // Persist visible, semantic and machine-readable proof for one completed energy adapter.\n  function energyCommit(name, method, value) {\n    energyAddFallbackPlot();\n    var result = document.createElement(\"div\");\n    result.className = \"demo-result\";\n    result.textContent = name + \" · 真实公开 API：\" + method + \" · 固定能耗数据：\" + energyData.records.map(function (row) {\n      return row.label + \"=\" + row.value;\n    }).join(\"、\") + \" · 结果：\" + energySummarize(value);\n    energyHost.appendChild(result);\n    energyHost.dataset.demoLibrary = name;\n    energyHost.dataset.demoApi = method;\n    energyHost.dataset.demoTheme = \"home-energy-dashboard\";\n  }\n\n  // Call an explicit public API for every one of the eight energy libraries.\n  async function energyInvoke(name, api) {\n    switch (name) {\n      case \"@observablehq/plot\": {\n        var plot = api.plot({\n          width: 640,\n          height: 230,\n          x: { label: \"家庭用能项目\" },\n          y: { label: \"千瓦时\" },\n          marks: [api.barY(energyData.records, { x: \"label\", y: \"value\", fill: energyAccent }), api.ruleY([0])]\n        });\n        energyHost.appendChild(plot);\n        return { method: \"Plot.plot.barY.ruleY\", value: { marks: energyData.records.length, svg: plot.tagName } };\n      }\n      case \"chroma-js\": {\n        var colorScale = api.scale([\"#166534\", \"#f59e0b\", \"#dc2626\"]).domain([0, 50, 100]);\n        var swatches = document.createElement(\"div\");\n        swatches.style.cssText = \"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:28px\";\n        energyData.records.forEach(function (row) {\n          var swatch = document.createElement(\"div\");\n          swatch.textContent = row.label + \" · \" + row.value + \" kWh\";\n          swatch.style.cssText = \"padding:28px;border-radius:14px;color:white;background:\" + colorScale(Number(row.value)).hex();\n          swatches.appendChild(swatch);\n        });\n        energyHost.appendChild(swatches);\n        return { method: \"chroma.scale.domain.hex\", value: energyData.records.map(function (row) { return colorScale(Number(row.value)).hex(); }) };\n      }\n      case \"d3\": {\n        var d3Svg = api.create(\"svg\").attr(\"viewBox\", \"0 0 640 220\").attr(\"aria-label\", \"D3 家庭能耗分布图\");\n        var x = api.scaleBand().domain(energyData.records.map(function (row) { return row.label; })).range([50, 610]).padding(0.24);\n        var y = api.scaleLinear().domain([0, api.max(energyData.records, function (row) { return Number(row.value); })]).nice().range([190, 25]);\n        d3Svg.selectAll(\"rect\").data(energyData.records).join(\"rect\").attr(\"x\", function (row) { return x(row.label); }).attr(\"y\", function (row) { return y(Number(row.value)); }).attr(\"width\", x.bandwidth()).attr(\"height\", function (row) { return 190 - y(Number(row.value)); }).attr(\"fill\", energyAccent);\n        energyHost.appendChild(d3Svg.node());\n        return { method: \"d3.scaleBand.scaleLinear.join\", value: { bars: d3Svg.selectAll(\"rect\").size(), mean: api.mean(energyData.records, function (row) { return Number(row.value); }) } };\n      }\n      case \"echarts\": {\n        var echartsRoot = document.createElement(\"div\");\n        echartsRoot.style.cssText = \"width:640px;height:230px\";\n        energyHost.appendChild(echartsRoot);\n        var echartsChart = api.init(echartsRoot);\n        echartsChart.setOption({\n          animation: false,\n          tooltip: { trigger: \"item\" },\n          series: [{ type: \"pie\", radius: [\"38%\", \"72%\"], data: energyData.records.map(function (row) { return { name: row.label, value: row.value }; }) }]\n        });\n        energyDispose = function () { echartsChart.dispose(); };\n        return { method: \"echarts.init.setOption.getOption\", value: { sectors: echartsChart.getOption().series[0].data.length } };\n      }\n      case \"gridstack\": {\n        var gridRoot = document.createElement(\"div\");\n        gridRoot.className = \"grid-stack\";\n        energyHost.appendChild(gridRoot);\n        var grid = api.init({ column: 3, float: true, cellHeight: 72, margin: 8 }, gridRoot);\n        energyData.records.forEach(function (row, index) {\n          var widget = document.createElement(\"div\");\n          widget.className = \"grid-stack-item\";\n          widget.setAttribute(\"gs-x\", String(index));\n          widget.setAttribute(\"gs-y\", \"0\");\n          widget.setAttribute(\"gs-w\", \"1\");\n          widget.setAttribute(\"gs-h\", \"1\");\n          var widgetContent = document.createElement(\"div\");\n          widgetContent.className = \"grid-stack-item-content\";\n          widgetContent.textContent = String(row.label) + \" · \" + String(row.value) + \" kWh\";\n          widget.appendChild(widgetContent);\n          gridRoot.appendChild(widget);\n          grid.makeWidget(widget);\n        });\n        grid.update(gridRoot.children[0], { x: 1 });\n        energyDispose = function () { grid.destroy(false); };\n        return { method: \"GridStack.init.makeWidget.update\", value: { widgets: gridRoot.querySelectorAll(\".grid-stack-item\").length, draggable: true } };\n      }\n      case \"simple-statistics\": {\n        var values = energyData.records.map(function (row) { return Number(row.value); });\n        return { method: \"simpleStatistics.mean.median.standardDeviation\", value: { mean: api.mean(values), median: api.median(values), standardDeviation: api.standardDeviation(values) } };\n      }\n      case \"vega\": {\n        var vegaRoot = document.createElement(\"div\");\n        energyHost.appendChild(vegaRoot);\n        var runtime = api.parse({\n          width: 560,\n          height: 180,\n          padding: 5,\n          data: [{ name: \"table\", values: energyData.records }],\n          scales: [{ name: \"x\", type: \"band\", domain: { data: \"table\", field: \"label\" }, range: \"width\", padding: 0.2 }, { name: \"y\", type: \"linear\", domain: { data: \"table\", field: \"value\" }, nice: true, zero: true, range: \"height\" }],\n          marks: [{ type: \"rect\", from: { data: \"table\" }, encode: { enter: { x: { scale: \"x\", field: \"label\" }, width: { scale: \"x\", band: 1 }, y: { scale: \"y\", field: \"value\" }, y2: { scale: \"y\", value: 0 }, fill: { value: energyAccent } } } }]\n        }, null, { ast: true });\n        if (!window.vegaExpressionInterpreter || typeof window.vegaExpressionInterpreter.operator !== \"function\") throw new Error(\"Vega CSP 解释器未内联\");\n        var view = new api.View(runtime, { renderer: \"svg\", hover: true, expr: window.vegaExpressionInterpreter }).initialize(vegaRoot);\n        await view.runAsync();\n        energyDispose = function () { view.finalize(); };\n        return { method: \"vega.parse.View.runAsync.data\", value: { marks: vegaRoot.querySelectorAll(\"rect\").length, rows: view.data(\"table\").length } };\n      }\n      case \"vega-lite\": {\n        var compiled = api.compile({\n          data: { values: energyData.records },\n          mark: { type: \"bar\", color: energyAccent },\n          width: 560,\n          height: 180,\n          encoding: { x: { field: \"label\", type: \"nominal\", title: \"用能项目\" }, y: { field: \"value\", type: \"quantitative\", title: \"千瓦时\" } }\n        });\n        var vegaLiteRoot = document.createElement(\"div\");\n        energyHost.appendChild(vegaLiteRoot);\n        if (!window.vegaExpressionInterpreter || typeof window.vegaExpressionInterpreter.operator !== \"function\") throw new Error(\"Vega-Lite CSP 解释器未内联\");\n        var vegaLiteRuntime = window.vega.parse(compiled.spec, null, { ast: true });\n        var vegaLiteView = new window.vega.View(vegaLiteRuntime, { renderer: \"svg\", hover: true, expr: window.vegaExpressionInterpreter }).initialize(vegaLiteRoot);\n        await vegaLiteView.runAsync();\n        energyDispose = function () { vegaLiteView.finalize(); };\n        return { method: \"vegaLite.compile.vega.View.runAsync\", value: { compiledMarks: compiled.spec.marks.length, visibleRects: vegaLiteRoot.querySelectorAll(\"rect\").length } };\n      }\n      default:\n        throw new Error(\"主题 03 未声明适配器：\" + name);\n    }\n  }\n\n  // Run one selected card and require a visible topic result before reporting success.\n  async function energyRun(card, item) {\n    if (energyDispose) {\n      try { energyDispose(); } catch (disposeError) { void disposeError; }\n      energyDispose = null;\n    }\n    energyHost.replaceChildren();\n    energyHost.removeAttribute(\"data-demo-library\");\n    document.querySelectorAll(\".card\").forEach(function (node) { node.classList.remove(\"active\", \"failed\"); });\n    card.classList.add(\"active\");\n    var cardStatus = card.querySelector(\".card-status\");\n    card.dataset.demoStatus = \"running\";\n    cardStatus.textContent = \"运行中\";\n    try {\n      var api = energyResolve(item.binding);\n      if (api == null) throw new Error(\"未找到公开绑定 \" + item.binding);\n      var proof = await energyInvoke(item.library, api);\n      if (!proof || !proof.method) throw new Error(\"适配器未返回 API 证据\");\n      energyCommit(item.library, proof.method, proof.value);\n      if (!energyHost.firstElementChild || energyHost.dataset.demoLibrary !== item.library) throw new Error(\"可见后置条件未通过\");\n      card.dataset.demoStatus = \"passed\";\n      cardStatus.textContent = \"真实调用通过\";\n      energyStatus.textContent = item.library + \"：\" + proof.method + \" 已执行；家庭能耗结果已更新。\";\n      return proof;\n    } catch (error) {\n      card.classList.add(\"failed\");\n      card.dataset.demoStatus = \"failed\";\n      cardStatus.textContent = \"调用失败\";\n      energyHost.replaceChildren();\n      var failure = document.createElement(\"div\");\n      failure.className = \"demo-result\";\n      failure.textContent = item.library + \" 演示失败：\" + String(error && error.message || error);\n      energyHost.appendChild(failure);\n      energyStatus.textContent = item.library + \" 未通过；已保留错误摘要，未伪报成功。\";\n      throw error;\n    }\n  }\n\n  // Keep the R4 HTML shell and bind its existing buttons to this theme-only runner.\n  document.querySelectorAll(\".card\").forEach(function (card, index) {\n    card.querySelector(\".probe\").addEventListener(\"click\", function () { energyRun(card, energyItems[index]).catch(function () { return undefined; }); });\n  });\n  var energyFirst = document.querySelector(\".card\");\n  if (energyFirst) energyRun(energyFirst, energyItems[0]).catch(function () { return undefined; });\n\n  // Expose a unique audit object used only to verify this real Dify BLOB.\n  window.__pagespecHomeEnergyR4 = {\n    items: energyItems,\n    runLibrary: function (name) {\n      var cards = Array.prototype.slice.call(document.querySelectorAll(\".card\"));\n      var index = energyItems.findIndex(function (item) { return item.library === name; });\n      if (index < 0 || !cards[index]) return Promise.reject(new Error(\"unknown energy library\"));\n      return energyRun(cards[index], energyItems[index]);\n    }\n  };\n}());\n{% endraw %}"

        selected: false
        template: "{% raw %}(function () {\n  \"use strict\";\n\n  // These independent sentinels prove both escape preservation and selection of the correct theme payload.\n  const __PAGESPEC_R4_TRANSPORT_SENTINEL__ = \"LF=\\\\n|CRLF=\\\\r\\\\n|SLASH=\\\\\\\\|SQUOTE=\\'|DQUOTE=\\\\\"|JINJA={{literal}}\";\n  const pagespecR4Theme04Canonical = \"PAGESPEC_R4_THEME_04_CANONICAL\";\n\n  // Theme 04 owns all thirty-four collaboration adapters and has no shared scheduler or cross-theme import.\n  var campusItems = [\n    { library: \"bpmn-js\", binding: \"BpmnJS\" },\n    { library: \"chrono-node\", binding: \"PageSpec_chrono_node_js.chrono\" },\n    { library: \"cronstrue\", binding: \"cronstrue\" },\n    { library: \"cytoscape\", binding: \"cytoscape\" },\n    { library: \"cytoscape-cise\", binding: \"PageSpecCytoscapeCise\" },\n    { library: \"cytoscape-cola\", binding: \"PageSpecCytoscapeCola\" },\n    { library: \"cytoscape-context-menus\", binding: \"cytoscapeContextMenus\" },\n    { library: \"cytoscape-edgehandles\", binding: \"cytoscapeEdgehandles\" },\n    { library: \"cytoscape-expand-collapse\", binding: \"cytoscapeExpandCollapse\" },\n    { library: \"cytoscape-fcose\", binding: \"cytoscapeFcose\" },\n    { library: \"cytoscape-navigator\", binding: \"cytoscapeNavigator\" },\n    { library: \"cytoscape-undo-redo\", binding: \"cytoscapeUndoRedo\" },\n    { library: \"d3-dag\", binding: \"PageSpecD3Dag\" },\n    { library: \"d3-org-chart\", binding: \"PageSpecD3OrgChart\" },\n    { library: \"d3-sankey\", binding: \"PageSpecSankey\" },\n    { library: \"dagre\", binding: \"dagre\" },\n    { library: \"dayjs\", binding: \"dayjs\" },\n    { library: \"echarts\", binding: \"echarts\" },\n    { library: \"frappe-gantt\", binding: \"Gantt\" },\n    { library: \"fullcalendar\", binding: \"FullCalendar\" },\n    { library: \"g6\", binding: \"PageSpecG6\" },\n    { library: \"graphology\", binding: \"PageSpecGraphology\" },\n    { library: \"graphology-io\", binding: \"PageSpecGraphologyIO\" },\n    { library: \"graphology-layout-forceatlas2\", binding: \"PageSpecForceAtlas2\" },\n    { library: \"humanize-duration\", binding: \"PageSpec_humanize_duration_js.humanizeDuration\" },\n    { library: \"mermaid\", binding: \"mermaid\" },\n    { library: \"mind-elixir\", binding: \"MindElixir\" },\n    { library: \"react\", binding: \"ReactDOMClient.createRoot\" },\n    { library: \"react-flow\", binding: \"PageSpecReactFlow\" },\n    { library: \"rrule\", binding: \"rrule\" },\n    { library: \"sigma\", binding: \"Sigma\" },\n    { library: \"vis-timeline\", binding: \"vis\" },\n    { library: \"wavedrom\", binding: \"WaveDrom\" },\n    { library: \"x6\", binding: \"PageSpecX6\" }\n  ];\n  var campusAccent = \"#38bdf8\";\n  var campusData = JSON.parse(document.getElementById(\"theme-data\").textContent);\n  var campusHost = document.getElementById(\"demo-host\");\n  var campusStatus = document.getElementById(\"status\");\n  var campusDispose = null;\n\n  // Resolve only a predeclared document-global binding; no code text is compiled or repaired.\n  function campusResolve(path) {\n    return String(path || \"\").split(\".\").filter(Boolean).reduce(function (value, key) {\n      return value == null ? undefined : value[key];\n    }, window);\n  }\n\n  // Convert an API return value into a bounded semantic proof suitable for the fixed report shell.\n  function campusSummarize(value) {\n    try {\n      if (value == null) return String(value);\n      if (typeof value === \"string\") return value.slice(0, 300);\n      if (typeof value === \"number\" || typeof value === \"boolean\") return String(value);\n      if (Array.isArray(value)) return JSON.stringify(value.slice(0, 10));\n      return JSON.stringify(value).slice(0, 300);\n    } catch (error) {\n      return Object.prototype.toString.call(value);\n    }\n  }\n\n  // Render a deterministic campus collaboration path only when an adapter has no native visual output.\n  function campusAddFallbackPlot() {\n    if (campusHost.querySelector(\"canvas,svg,.react-flow,.vis-timeline,.fc,.mind-elixir,.g6-container,.x6-graph\")) return;\n    var svg = document.createElementNS(\"http://www.w3.org/2000/svg\", \"svg\");\n    svg.setAttribute(\"viewBox\", \"0 0 720 190\");\n    svg.setAttribute(\"aria-label\", \"校园协作固定流程图\");\n    campusData.records.forEach(function (row, index) {\n      var x = 60 + index * 220;\n      if (index > 0) {\n        var edge = document.createElementNS(\"http://www.w3.org/2000/svg\", \"line\");\n        edge.setAttribute(\"x1\", String(x - 130));\n        edge.setAttribute(\"y1\", \"82\");\n        edge.setAttribute(\"x2\", String(x - 30));\n        edge.setAttribute(\"y2\", \"82\");\n        edge.setAttribute(\"stroke\", campusAccent);\n        edge.setAttribute(\"stroke-width\", \"5\");\n        svg.appendChild(edge);\n      }\n      var node = document.createElementNS(\"http://www.w3.org/2000/svg\", \"rect\");\n      node.setAttribute(\"x\", String(x));\n      node.setAttribute(\"y\", \"48\");\n      node.setAttribute(\"width\", \"150\");\n      node.setAttribute(\"height\", \"68\");\n      node.setAttribute(\"rx\", \"14\");\n      node.setAttribute(\"fill\", \"#10243d\");\n      node.setAttribute(\"stroke\", campusAccent);\n      node.setAttribute(\"stroke-width\", \"3\");\n      svg.appendChild(node);\n      var label = document.createElementNS(\"http://www.w3.org/2000/svg\", \"text\");\n      label.setAttribute(\"x\", String(x + 75));\n      label.setAttribute(\"y\", \"87\");\n      label.setAttribute(\"text-anchor\", \"middle\");\n      label.setAttribute(\"fill\", \"#dbe7ff\");\n      label.textContent = String(row.label);\n      svg.appendChild(label);\n    });\n    campusHost.appendChild(svg);\n  }\n\n  // Attach visible evidence and stable postcondition attributes for the selected collaboration library.\n  function campusCommit(name, method, value) {\n    campusAddFallbackPlot();\n    var result = document.createElement(\"div\");\n    result.className = \"demo-result\";\n    result.textContent = name + \" · 真实公开 API：\" + method + \" · 固定协作数据：\" + campusData.records.map(function (row) {\n      return row.label + \"=\" + row.value;\n    }).join(\"、\") + \" · 结果：\" + campusSummarize(value);\n    campusHost.appendChild(result);\n    campusHost.dataset.demoLibrary = name;\n    campusHost.dataset.demoApi = method;\n    campusHost.dataset.demoTheme = \"campus-collaboration\";\n  }\n\n  // Build a visible Cytoscape graph used by one extension-specific adapter at a time.\n  function campusCreateCytoscapeGraph() {\n    var root = document.createElement(\"div\");\n    root.style.cssText = \"width:640px;height:240px\";\n    campusHost.appendChild(root);\n    var graph = window.cytoscape({\n      container: root,\n      elements: [\n        { data: { id: \"course\", label: \"课程设计\", parent: \"program\" } },\n        { data: { id: \"club\", label: \"社团协作\", parent: \"program\" } },\n        { data: { id: \"show\", label: \"成果展览\" } },\n        { data: { id: \"program\", label: \"校园项目\" } },\n        { data: { id: \"e1\", source: \"course\", target: \"club\" } },\n        { data: { id: \"e2\", source: \"club\", target: \"show\" } }\n      ],\n      layout: { name: \"grid\" },\n      style: [\n        { selector: \"node\", style: { label: \"data(label)\", \"background-color\": campusAccent, color: \"#dbe7ff\", \"text-valign\": \"bottom\" } },\n        { selector: \"edge\", style: { width: 3, \"line-color\": \"#94a3b8\", \"target-arrow-color\": \"#94a3b8\", \"target-arrow-shape\": \"triangle\", \"curve-style\": \"bezier\" } }\n      ]\n    });\n    return { root: root, graph: graph };\n  }\n\n  // Wait for queued renderer work to cross animation-frame boundaries before declaring an adapter settled.\n  async function campusWaitFrames(count) {\n    var frames = Math.max(0, Number(count) || 0);\n    for (var frame = 0; frame < frames; frame += 1) {\n      await new Promise(function (resolve) { requestA
       return { method: \"PageSpecX6.Graph.addNode.addEdge.zoom\", value: { nodes: x6Graph.getNodes().length, edges: x6Graph.getEdges().length, zoom: x6Graph.zoom() } };\n      }\n      default:\n        throw new Error(\"主题 04 未声明适配器：\" + name);\n    }\n  }\n\n  // Run one selected card and reject any result lacking visible and semantic proof.\n  async function campusRun(card, item) {\n    if (campusDispose) {\n      try { await Promise.resolve(campusDispose()); } catch (disposeError) { void disposeError; }\n      campusDispose = null;\n    }\n    campusHost.replaceChildren();\n    campusHost.removeAttribute(\"data-demo-library\");\n    document.querySelectorAll(\".card\").forEach(function (node) { node.classList.remove(\"active\", \"failed\"); });\n    card.classList.add(\"active\");\n    var cardStatus = card.querySelector(\".card-status\");\n    card.dataset.demoStatus = \"running\";\n    cardStatus.textContent = \"运行中\";\n    try {\n      var api = campusResolve(item.binding);\n      if (api == null) throw new Error(\"未找到公开绑定 \" + item.binding);\n      var proof = await campusInvoke(item.library, api);\n      if (!proof || !proof.method) throw new Error(\"适配器未返回 API 证据\");\n      campusCommit(item.library, proof.method, proof.value);\n      if (!campusHost.firstElementChild || campusHost.dataset.demoLibrary !== item.library) throw new Error(\"可见后置条件未通过\");\n      card.dataset.demoStatus = \"passed\";\n      cardStatus.textContent = \"真实调用通过\";\n      campusStatus.textContent = item.library + \"：\" + proof.method + \" 已执行；校园协作结果已更新。\";\n      return proof;\n    } catch (error) {\n      card.classList.add(\"failed\");\n      card.dataset.demoStatus = \"failed\";\n      cardStatus.textContent = \"调用失败\";\n      campusHost.replaceChildren();\n      var failure = document.createElement(\"div\");\n      failure.className = \"demo-result\";\n      failure.textContent = item.library + \" 演示失败：\" + String(error && error.message || error);\n      campusHost.appendChild(failure);\n      campusStatus.textContent = item.library + \" 未通过；已保留错误摘要，未伪报成功。\";\n      throw error;\n    }\n  }\n\n  // Bind the existing R4 controls; markup, styles and user-facing layout remain unchanged.\n  document.querySelectorAll(\".card\").forEach(function (card, index) {\n    card.querySelector(\".probe\").addEventListener(\"click\", function () { campusRun(card, campusItems[index]).catch(function () { return undefined; }); });\n  });\n  var campusFirst = document.querySelector(\".card\");\n  if (campusFirst) campusRun(campusFirst, campusItems[0]).catch(function () { return undefined; });\n\n  // Expose a theme-exclusive audit hook for the real Dify 1.7.1 BLOB verifier.\n  window.__pagespecCampusCollaborationR4 = {\n    items: campusItems,\n    runLibrary: function (name) {\n      var cards = Array.prototype.slice.call(document.querySelectorAll(\".card\"));\n      var index = campusItems.findIndex(function (item) { return item.library === name; });\n      if (index < 0 || !cards[index]) return Promise.reject(new Error(\"unknown campus library\"));\n      return campusRun(cards[index], campusItems[index]);\n    }\n  };\n}());\n{% endraw %}"

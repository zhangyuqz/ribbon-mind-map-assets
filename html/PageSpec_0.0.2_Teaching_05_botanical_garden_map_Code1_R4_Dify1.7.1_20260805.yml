">待运行</span></article><article class=\\"card\\" data-library=\\"leaflet.heat\\" data-binding=\\"L.heatLayer\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>leaflet.heat</h3><span>0.2.0</span></div><p>使用 leaflet.heat 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"leaflet.markercluster\\" data-binding=\\"L.MarkerClusterGroup\\" data-style=\\"true\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>leaflet.markercluster</h3><span>1.5.3</span></div><p>使用 leaflet.markercluster 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"proj4\\" data-binding=\\"proj4\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>proj4</h3><span>2.20.9</span></div><p>使用 proj4 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"satellite.js\\" data-binding=\\"PageSpecSatellite\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>satellite.js</h3><span>7.1.0</span></div><p>使用 satellite.js 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"topojson-client\\" data-binding=\\"topojson\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>topojson-client</h3><span>3.1.0</span></div><p>使用 topojson-client 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article><article class=\\"card\\" data-library=\\"turf\\" data-binding=\\"turf\\" data-style=\\"false\\" data-demo-status=\\"pending\\"><div class=\\"card-head\\"><h3>turf</h3><span>7.3.5</span></div><p>使用 turf 的离线公开 API处理固定主题数据，并显示可核验结果。</p><button type=\\"button\\" class=\\"probe\\">运行本库演示</button><span class=\\"card-status\\" role=\\"status\\">待运行</span></article></div></section>\\n<p class=\\"footer\\">植物园季相观察与自然步道地图 · 固定合成数据 · R4 教学修订版</p></main>\\n<script id=\\"theme-data\\" type=\\"application/json\\">{\\"theme\\":\\"植物园季相观察与自然步道地图\\",\\"records\\":[{\\"label\\":\\"春季花期\\",\\"value\\":24},{\\"label\\":\\"夏季浓荫\\",\\"value\\":35},{\\"label\\":\\"秋季果实\\",\\"value\\":29}],\\"revision\\":\\"R4\\"}</script>\\n\\n<!-- pagespec:caller-script --><script src=\\"scripts/app.js\\"></script></body></html>","loader":"html","mime":"text/html"},"scripts/app.js":{"code_ref":"code1","loader":"js","mime":"text/javascript"}}}


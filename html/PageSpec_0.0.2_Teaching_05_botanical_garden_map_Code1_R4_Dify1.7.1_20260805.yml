e05State.failed += 1;\n      theme05State.lastLibrary = library;\n      theme05Status.textContent = library + \\' 演示失败：\\' + error.message;\n      throw error;\n    }\n  }\n\n  // Bind the existing card buttons without inserting, deleting, or restyling any report control.\n  document.querySelectorAll(\\'.card\\').forEach(function theme05BindCard(card) {\n    var button = card.querySelector(\\'.probe\\');\n    button.addEventListener(\\'click\\', function theme05HandleClick() {\n      theme05RunCard(card).catch(function theme05KeepVisibleFailure() {});\n    });\n  });\n\n  window.PageSpecR4Theme05 = theme05State;\n  var theme05FirstCard = document.querySelector(\\'.card\\');\n  if (theme05FirstCard) {\n    theme05RunCard(theme05FirstCard).catch(function theme05KeepInitialFailure() {});\n  }\n}());\n{% endraw %}"

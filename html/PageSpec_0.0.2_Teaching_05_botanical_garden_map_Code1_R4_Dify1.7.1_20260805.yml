        desc: 模板节点输出不透明 JavaScript；插件仅在收件人打开 HTML 时于本地浏览器执行。
        selected: false
        template: "{% raw %}\\'use strict\\';\n\n/* PAGESPEC_R4_THEME_05_CANONICAL */\n(function theme05BotanicalGardenCode1() {\n  const __PAGESPEC_R4_TRANSPORT_SENTINEL__ = \"LF=\\\\n|CRLF=\\\\r\\\\n|SLASH=\\\\\\\\|SQUOTE=\\'|DQUOTE=\\\\\"|JINJA={{literal}}\";\n  var THEME05_LIBRARIES = [\\'@tmcw/togeojson\\', \\'deck.gl\\', \\'gcoord\\', \\'h3-js\\', \\'leaflet\\', \\'leaflet-ant-path\\', \\'leaflet-geoman\\', \\'leaflet-polylinedecorator\\', \\'leaflet-timedimension\\', \\'leaflet.heat\\', \\'leaflet.markercluster\\', \\'proj4\\', \\'satellite.js\\', \\'topojson-client\\', \\'turf\\'];\n  var theme05Host = document.getElementById(\\'demo-host\\');\n  var theme05Status = document.getElementById(\\'status\\');\n  var theme05Data = JSON.parse(document.getElementById(\\'theme-data\\').textContent);\n  var theme05State = { theme: 5, total: THEME05_LIBRARIES.length, executed: 0, passed: 0, failed: 0, lastLibrary: null, transport: __PAGESPEC_R4_TRANSPORT_SENTINEL__ };\n\n  // Resolve only the compiler-declared document binding; no discovery, eval, network, or repair path is allowed.\n  function theme05ResolveBinding(path) {\n    return path.split(\\'.\\').reduce(function theme05ResolvePart(value, key) {\n      return value == null ? null : value[key];\n    }, window);\n  }\n\n  // Produce an auditable topic panel from the real API result while preserving the existing report shell.\n  function theme05RenderResult(library, result) {\n    var title = document.createElement(\\'h3\\');\n    var summary = document.createElement(\\'p\\');\n    var pre = document.createElement(\\'pre\\');\n    title.textContent = \\'植物园离线地理演示 · \\' + library;\n    summary.textContent = \\'已用内置公开 API 处理春季花期、夏季浓荫和秋季果实三类固定观察数据。\\';\n    pre.textContent = JSON.stringify(result, null, 2);\n    pre.style.cssText = \\'white-space:pre-wrap;word-break:break-word;margin:12px 0 0;padding:12px;border-radius:10px;background:#07111f;color:#dcfce7\\';\n    theme05Host.appendChild(title);\n    theme05Host.appendChild(summary);\n    theme05Host.appendChild(pre);\n  }\n\n  // Each branch calls a documented public API and returns deterministic, domain-specific evidence.\n  function theme05CallLibrary(library, api) {\n    switch (library) {\n      case \\'@tmcw/togeojson\\': {\n        var xml = new DOMParser().parseFromString(\\'<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Placemark><name>春季花期样点</name><Point><coordinates>120.155,30.274</coordinates></Point></Placemark></kml>\\', \\'text/xml\\');\n        var featureCollection = api.kml(xml);\n        return { method: \\'toGeoJSON.kml\\', features: featureCollection.features.length, name: featureCollection.features[0].properties.name };\n      }\n      case \\'deck.gl\\': {\n        var viewport = new api.WebMercatorViewport({ width: 600, height: 220, longitude: 120.155, latitude: 30.274, zoom: 10 });\n        var projected = viewport.project([120.16, 30.28]);\n        return { method: \\'WebMercatorViewport.project\\', pixel: projected.map(function theme05RoundPixel(value) { return Number(value.toFixed(2)); }) };\n      }\n      case \\'gcoord\\': {\n        var transformed = api.transform([120.155, 30.274], api.WGS84, api.GCJ02);\n        return { method: \\'gcoord.transform\\', gcj02: transformed.map(function theme05RoundCoordinate(value) { return Number(value.toFixed(6)); }) };\n      }\n      case \\'h3-js\\': {\n        var cell = api.latLngToCell(30.274, 120.155, 7);\n        return { method: \\'h3.latLngToCell/cellToBoundary\\', cell: cell, vertices: api.cellToBoundary(cell).length };\n      }\n      case \\'leaflet\\': {\n        var start = api.latLng(30.274, 120.155);\n        var meters = start.distanceTo(api.latLng(30.284, 120.165));\n        return { method: \\'Leaflet.latLng.distanceTo\\', routeMeters: Number(meters.toFixed(1)) };\n      }\n      case \\'leaflet-ant-path\\': {\n        var antPath = api([[30.27, 120.15], [30.28, 120.16]], { delay: 800 });\n        return { method: \\'L.polyline.antPath/getL
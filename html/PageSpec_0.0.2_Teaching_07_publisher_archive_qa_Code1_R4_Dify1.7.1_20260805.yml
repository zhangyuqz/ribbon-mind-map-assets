        template: "{% raw %}\\'use strict\\';\n\n/* PAGESPEC_R4_THEME_07_CANONICAL */\n(function theme07PublisherArchiveCode1() {\n  const __PAGESPEC_R4_TRANSPORT_SENTINEL__ = \"LF=\\\\n|CRLF=\\\\r\\\\n|SLASH=\\\\\\\\|SQUOTE=\\'|DQUOTE=\\\\\"|JINJA={{literal}}\";\n  var THEME07_LIBRARIES = [\\'@msgpack/msgpack\\', \\'alpinejs\\', \\'bcryptjs\\', \\'bootstrap\\', \\'compromise\\', \\'confusables\\', \\'crossfilter2\\', \\'diff\\', \\'diff2html\\', \\'docx\\', \\'docx-preview\\', \\'dompurify\\', \\'exceljs\\', \\'fast-xml-parser\\', \\'flexsearch\\', \\'franc-min\\', \\'geolib\\', \\'he\\', \\'highlight.js\\', \\'html2canvas\\', \\'interactjs\\', \\'jmespath\\', \\'jose\\', \\'jquery\\', \\'js-yaml\\', \\'jsonata\\', \\'jsondiffpatch\\', \\'jspdf\\', \\'jspdf-autotable\\', \\'jszip\\', \\'linkify-it\\', \\'lit\\', \\'lodash\\', \\'lucide\\', \\'mark.js\\', \\'marked\\', \\'mustache\\', \\'otpauth\\', \\'pagedjs\\', \\'pako\\', \\'papaparse\\', \\'pdf-lib\\', \\'pkijs\\', \\'postal-mime\\', \\'pptxgenjs\\', \\'preact\\', \\'react\\', \\'sanitize-url\\', \\'sm-crypto\\', \\'solid-js\\', \\'sortablejs\\', \\'tabulator-tables\\', \\'turndown\\', \\'uri-js\\', \\'vue\\', \\'xlsx\\', \\'zod\\'];\n  var theme07Host = document.getElementById(\\'demo-host\\');\n  var theme07Status = document.getElementById(\\'status\\');\n  var theme07Data = JSON.parse(document.getElementById(\\'theme-data\\').textContent);\n  var theme07Cleanup = null;\n  var theme07LF = String.fromCharCode(10);\n  var theme07CRLF = String.fromCharCode(13, 10);\n  var theme07State = { theme: 7, total: THEME07_LIBRARIES.length, executed: 0, passed: 0, failed: 0, lastLibrary: null, transport: __PAGESPEC_R4_TRANSPORT_SENTINEL__ };\n\n  // Resolve only the exact compiler-declared binding path for the selected library.\n  function theme07ResolveBinding(path) {\n    return path.split(\\'.\\').reduce(function theme07ResolvePart(value, key) {\n      return value == null ? null : value[key];\n    }, window);\n  }\n\n  // Append a stable evidence panel without deleting visible output created by a document or UI library.\n  function theme07RenderEvidence(library, result) {\n    var evidence = document.createElement(\\'section\\');\n    var title = document.createElement(\\'h3\\');\n    var pre = document.createElement(\\'pre\\');\n    title.textContent = \\'出版社档案质检 · \\' + library;\n    pre.textContent = JSON.stringify(result, null, 2);\n    pre.style.cssText = \\'white-space:pre-wrap;word-break:break-word;margin:10px 0 0;padding:12px;border-radius:10px;background:#120d08;color:#ffedd5\\';\n    evidence.appendChild(title);\n    evidence.appendChild(pre);\n    theme07Host.appendChild(evidence);\n  }\n\n  // Every case is a dedicated real-API adapter; no zero-argument guessing or shared cross-theme dispatcher exists.\n  function theme07CallLibrary(library, api) {\n    switch (library) {\n      // Structured data, security, and text-quality adapters.\n      case \\'@msgpack/msgpack\\': {\n        var packed = api.encode({ theme: theme07Data.theme, records: theme07Data.records });\n        var unpacked = api.decode(packed);\n        return { method: \\'MessagePack.encode/decode\\', bytes: packed.byteLength, records: unpacked.records.length };\n      }\n      case \\'alpinejs\\': {\n        var state = api.reactive({ count: 1, stage: \\'初校\\' });\n        state.count += 1;\n        state.stage = \\'复校\\';\n        return { method: \\'Alpine.reactive\\', count: state.count, stage: state.stage };\n      }\n      case \\'bcryptjs\\': {\n        var digest = api.hashSync(\\'teaching\\', 4);\n        return { method: \\'bcrypt.hashSync/compareSync\\', rounds: api.getRounds(digest), match: api.compareSync(\\'teaching\\', digest) };\n      }\n      case \\'compromise\\':\n        return { method: \\'nlp.nouns.toPlural\\', text: api(\\'one book and one archive\\').nouns().toPlural().text() };\n      case \\'confusables\\':\n        return { method: \\'confusables.remove\\', normalized: api.re
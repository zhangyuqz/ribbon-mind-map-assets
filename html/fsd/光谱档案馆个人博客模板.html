: "heading", "Text": "从一个具体观察开始"}, {"Type": "paragraph", "Text": "这是虚构作者为演示博客编写的第 1 篇完整记录。写下《界面之外，空间开始说话》时，我关心的不是增加多少装饰，而是一个视觉决定会怎样改变读者理解内容和采取行动的方式。\n高亮可以吸引视线，稳定的结构则帮助人理解这束高亮为什么存在。我的第一步是梳理内容、关系与下一项有意义的操作，然后才决定使用什么材质、转场或空间排列。"}, {"Type": "quote", "Text": "一个令人记住的效果，应当同时让内容更容易理解。"}, {"Type": "heading", "Text": "把想法放进一个小实验"}, {"Type": "paragraph", "Text": "实验从少量表面、明确的光线方向和有节奏的间距开始。我一次只观察一种变化，同时保留清晰的阅读顺序。\n空间深度适合表达对象之间的联系；长篇文字需要安静、稳定的二维阅读面。两者之间的切换应当保留上下文，让人知道自己从哪里来、正在看什么，以及如何回去。"}, {"Type": "image", "Src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgOTAwIDUyMCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJiZyIgeDI9IjEiIHkyPSIxIj48c3RvcCBzdG9wLWNvbG9yPSIjMzIyNzUzIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMTQxNTI0Ii8+PC9saW5lYXJHcmFkaWVudD48bGluZWFyR3JhZGllbnQgaWQ9ImxpZ2h0Ij48c3RvcCBzdG9wLWNvbG9yPSIjY2U5ZWU4Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjOWZmM2RkIi8+PC9saW5lYXJHcmFkaWVudD48cmFkaWFsR3JhZGllbnQgaWQ9ImZvZyI+PHN0b3Agc3RvcC1jb2xvcj0iI2NlOWVlOCIgc3RvcC1vcGFjaXR5PSIuMjciLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMzMjI3NTMiIHN0b3Atb3BhY2l0eT0iMCIvPjwvcmFkaWFsR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiBmaWxsPSJ1cmwoI2JnKSIvPjxwYXRoIGQ9Ik0wIDBIOTAwIE0wIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgNDBIOTAwIE03MCAwVjUyMCIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utb3BhY2l0eT0iLjAzNSIvPjxwYXRoIGQ9Ik0wIDgwSDkwMCBNMTQwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTIwSDkwMCBNMjEwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTYwSDkwMCBNMjgwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjAwSDkwMCBNMzUwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjQwSDkwMCBNNDIwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjgwSDkwMCBNNDkwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhd 。我的第一步是梳理内容、关系与下一项有意义的操作，然后才决定使用什么材质、转场或空间排列。"}, {"Type": "quote", "Text": "一个令人记住的效果，应当同时让内容更容易理解。"}, {"Type": "heading", "Text": "把想法放进一个小实验"}, {"Type": "paragraph", "Text": "实验从少量表面、明确的光线方向和有节奏的间距开始。我一次只观察一种变化，同时保留清晰的阅读顺序。\n空间深度适合表达对象之间的联系；长篇文字需要安静、稳定的二维阅读面。两者之间的切换应当保留上下文，让人知道自己从哪里来、正在看什么，以及如何回去。"}, {"Type": "image", "Src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgOTAwIDUyMCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJiZyIgeDI9IjEiIHkyPSIxIj48c3RvcCBzdG9wLWNvbG9yPSIjMjQzZTRhIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMTQxNTI0Ii8+PC9saW5lYXJHcmFkaWVudD48bGluZWFyR3JhZGllbnQgaWQ9ImxpZ2h0Ij48c3RvcCBzdG9wLWNvbG9yPSIjOTFkY2QyIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjYzNiMWZmIi8+PC9saW5lYXJHcmFkaWVudD48cmFkaWFsR3JhZGllbnQgaWQ9ImZvZyI+PHN0b3Agc3RvcC1jb2xvcj0iIzkxZGNkMiIgc3RvcC1vcGFjaXR5PSIuMjciLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMyNDNlNGEiIHN0b3Atb3BhY2l0eT0iMCIvPjwvcmFkaWFsR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiBmaWxsPSJ1cmwoI2JnKSIvPjxwYXRoIGQ9Ik0wIDBIOTAwIE0wIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgNDBIOTAwIE03MCAwVjUyMCIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utb3BhY2l0eT0iLjAzNSIvPjxwYXRoIGQ9Ik0wIDgwSDkwMCBNMTQwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTIwSDkwMCBNMjEwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTYwSDkwMCBNMjgwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjAwSDkwMCBNMzUwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjQwSDkwMCBNNDIwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjgwSDkwMCBNNDkwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMzIwSDkwMCBNNTYwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMzYwSDkwMCBNNjMwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIu 么、哪里仍不理想、下一次值得尝试什么写下来。一个没有达到预期的实验，只要保留完整上下文，仍然可以成为有价值的记录。\n这个档案通过明确提供的关系连接文章。“共同标签”表示主题相近，并不自动意味着彼此引用。标签需要说清楚关系的原意，图谱才不会用漂亮的线条制造误解。"}], "Footnote": "本文为原创演示内容，作者及经历均为虚构。"}, {"Id": "P09", "Title": "把日常观察变成设计实验", "ShortTitle": "日常实验", "Date": "2026-07-14", "Topic": "记录与方法", "Tags": ["记录与方法", "设计笔记"], "Summary": "围绕「记录与方法」的一次个人观察：从一个具体问题出发，经过小规模实验，留下可继续讨论的记录。", "Cover": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgOTAwIDUyMCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJiZyIgeDI9IjEiIHkyPSIxIj48c3RvcCBzdG9wLWNvbG9yPSIjMzIyNzUzIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMTQxNTI0Ii8+PC9saW5lYXJHcmFkaWVudD48bGluZWFyR3JhZGllbnQgaWQ9ImxpZ2h0Ij48c3RvcCBzdG9wLWNvbG9yPSIjY2U5ZWU4Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjOWZmM2RkIi8+PC9saW5lYXJHcmFkaWVudD48cmFkaWFsR3JhZGllbnQgaWQ9ImZvZyI+PHN0b3Agc3RvcC1jb2xvcj0iI2NlOWVlOCIgc3RvcC1vcGFjaXR5PSIuMjciLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMzMjI3NTMiIHN0b3Atb3BhY2l0eT0iMCIvPjwvcmFkaWFsR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiBmaWxsPSJ1cmwoI2JnKSIvPjxwYXRoIGQ9Ik0wIDBIOTAwIE0wIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgNDBIOTAwIE03MCAwVjUyMCIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utb3BhY2l0eT0iLjAzNSIvPjxwYXRoIGQ9Ik0wIDgwSDkwMCBNMTQwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTIwSDkwMCBNMjEwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTYwSDkwMCBNMjgwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjAwSDkwMCBNMzUwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjQwSDkwMCBNNDIwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjgwSDkwMCBNNDkwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMzIwSDkwMCBNNTYwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMzYwSDkwMCBNNjMwIDBWNTIwIiBzdHJ xt": "一个令人记住的效果，应当同时让内容更容易理解。"}, {"Type": "heading", "Text": "把想法放进一个小实验"}, {"Type": "paragraph", "Text": "实验从少量表面、明确的光线方向和有节奏的间距开始。我一次只观察一种变化，同时保留清晰的阅读顺序。\n空间深度适合表达对象之间的联系；长篇文字需要安静、稳定的二维阅读面。两者之间的切换应当保留上下文，让人知道自己从哪里来、正在看什么，以及如何回去。"}, {"Type": "image", "Src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgOTAwIDUyMCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJiZyIgeDI9IjEiIHkyPSIxIj48c3RvcCBzdG9wLWNvbG9yPSIjNDkzMTQ3Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMTQxNTI0Ii8+PC9saW5lYXJHcmFkaWVudD48bGluZWFyR3JhZGllbnQgaWQ9ImxpZ2h0Ij48c3RvcCBzdG9wLWNvbG9yPSIjZWZhYmM5Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjYjdiMGZmIi8+PC9saW5lYXJHcmFkaWVudD48cmFkaWFsR3JhZGllbnQgaWQ9ImZvZyI+PHN0b3Agc3RvcC1jb2xvcj0iI2VmYWJjOSIgc3RvcC1vcGFjaXR5PSIuMjciLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiM0OTMxNDciIHN0b3Atb3BhY2l0eT0iMCIvPjwvcmFkaWFsR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI5MDAiIGhlaWdodD0iNTIwIiBmaWxsPSJ1cmwoI2JnKSIvPjxwYXRoIGQ9Ik0wIDBIOTAwIE0wIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgNDBIOTAwIE03MCAwVjUyMCIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utb3BhY2l0eT0iLjAzNSIvPjxwYXRoIGQ9Ik0wIDgwSDkwMCBNMTQwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTIwSDkwMCBNMjEwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMTYwSDkwMCBNMjgwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjAwSDkwMCBNMzUwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjQwSDkwMCBNNDIwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMjgwSDkwMCBNNDkwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMzIwSDkwMCBNNTYwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgMzYwSDkwMCBNNjMwIDBWNTIwIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMDM1Ii8+PHBhdGggZD0iTTAgNDAwSDkwMCBNNzAwIDBWNTIwIiBzdHJva2U9IiNmZmZmZm

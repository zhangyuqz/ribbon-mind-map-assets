function trendChart(metric){const points=seed.Trends.slice(-range),values=points.map(p=>p[metric]),max=Math.max(1,...values)*1.15,min=0,w=560,h=155,step=w/Math.max(1,points.length-1),path=points.map((p,i)=>`${38+i*step},${h+12-(p[metric]-min)/(max-min)*h}`).join(' ');return `<svg class="chart" viewBox="0 0 630 220" role="group" aria-label="二维${metric==='Requests'?'请求量':'延迟'}趋势">${[0,.5,1].map(v=>`<line x1="38" y1="${12+v*h}" x2="598" y2="${12+v*h}" stroke="#36516b" stroke-dasharray="3 5"/><text x="3" y="${16+v*h}">${Math.round(max*(1-v))}</text>`).join('')}<polygon points="38,167 ${path} 598,167" fill="#40bddd15"/><polyline points="${path}" fill="none" stroke="#69e8fa" stroke-width="2.5"/>${points.map((p,i)=>`<g role="button" tabindex="0" aria-label="${encode(p.Time)}，${p[metric]}${metric==='Latency'?'毫秒':'次'}" data-act="time:${seed.Trends.indexOf(p)}"><circle class="chart-point" cx="${38+i*step}" cy="${h+12-p[metric]/max*h}" r="${seed.Trends.indexOf(p)===chosenTime?6:4}"/>${i%2===0||i===points.length-1?`<text x="${38+i*step}" y="195" text-anchor="middle">${encode(p.Time)}</text>`:''}</g>`).join('')}<text x="600" y="215" text-anchor="end">${metric==='Latency'?'响应延迟 / ms':'请求量 / 次'}</text></svg>`;}
function heatmap(){return `<div class="heatmap">${seed.Trends.map((p,i)=>`<button class="${p.Latency>100?'hot':''}" data-act="time:${i}" aria-label="${encode(p.Time)}延迟 ${p.Latency} 毫秒">${p.Latency}<small>${encode(p.Time)}</small></button>`).join('')}</div>`;}
function analysis(){const p=seed.Trends[chosenTime];main.innerHTML=title('METRICS & TRENDS','让每个变化，都有依据',`<label class="row">时间范围<select id="range"><option value="12" ${range===12?'selected':''}>全部时段</option><option value="6" ${range===6?'selected':''}>最近 6 个时段</option></select></label>`)+`<div class="deck"><section class="panel"><div class="panel-head"><h2>请求量趋势</h2><small>REQUESTS</small></div>${trendChart('Requests')}<div class="panel-head" style="margin-top:20px"><h2>响应延迟</h2><small>MILLISECONDS</small></div>${trendChart('Latency')}</section><aside class="side-stack"><div class="panel teal"><div class="eyebrow">SELECTED SNAPSHOT</div><h2 style="font-size:26px;margin:14px 0">${encode(p.Time)}</h2><div class="metric-line"><span>请求量</span><b>${p.Requests.toLocaleString()}</b></div><div class="metric-line"><span>响应延迟</span><b>${p.Latency} ms</b></div><div class="chart-tip" id="chart-tip">已选中 ${encode(p.Time)} 的记录</div>${control('导出时段数据','trends-csv','outline small')}</div><div class="panel violet"><h2>时段压力矩阵</h2>${heatmap()}</div></aside></div>`;document.getElementById('range').onchange=e=>{range=Number(e.target.value);chosenTime=Math.max(seed.Trends.length-range,chosenTime);analysis();};}

/* Aurora's private grid keeps separate fields for event and site records, with the same complete UX. */
function gridColumns(){return current==='assets'?[['Name','站点'],['Region','区域'],['Status','状态'],['Owner','负责人'],['Load','负载 %'],['Latency','延迟 ms'],['Capacity','算力 TFLOPS']]:[['Title','事件'],['Site','所属站点'],['Level','等级'],['Status','状态'],['Time','时间'],['Owner','负责人']];}
function gridRows(){let rows=current==='assets'?data.sites:data.events.map(e=>({...e,Site:findSite(e.site)?.Name||'未分配站点'}));return rows.filter(p=>(!grid.find||Object.values(p).join(' ').toLowerCase().includes(grid.find.toLowerCase()))&&gridColumns().every(([k])=>!grid.filters[k]||grid.filters[k].includes(String(p[k])))).sort((a,b)=>{const v=typeof a[grid.sort]==='number'?a[grid.sort]-b[grid.sort]:String(a[grid.sort]??'').localeCompare(String(b[grid.sort]??''),'zh');return grid.up?v:-v;});}
function listing(){const asset=current==='assets',columns=gridColumns(),rows=gridRows(),pages=Math.max(1,Math.ceil(rows.length/grid.size));grid.page=Math.min(pages,grid.page);main.innerHTML=title(asset?'ASSET REGISTRY':'EVENT OPERATIONS',asset?'站点资产管理':'事件处置中心',control(svgIcon('plus')+(asset?'新增站点':'登记事件'),asset?'site-new':'event-new','primary'))+`<div class="panel"><div class="toolbar"><input id="grid-search" placeholder="搜索全部字段…" aria-label="搜索表格" value="${encode(grid.find)}">${control(svgIcon('columns-3')+'显示列','columns','outline small')}${control(svgIcon('file-down')+'导出 CSV','grid-csv','outline small')}${control('清除筛选','grid-reset','outline small')}</div><div class="tablebox"><table><thead><tr>${columns.filter(([k])=>!grid.hidden.includes(k)).map(([k,t])=>`<th><button data-act="sort:${k}" aria-label="按${t}排序">${t} ${grid.sort===k?(grid.up?'↑':'↓'):'↕'}</button> <button data-act="filter:${k}" aria-label="筛选${t}">${grid.filters[k]?'●':'▾'}</button></th>`).join('')}<th>操作</th></tr></thead><tbody>${rows.slice((grid.page-1)*grid.size,grid.page*grid.size).map(p=>`<tr>${columns.filter(([k])=>!grid.hidden.includes(k)).map(([k])=>`<td class="${['Title','Name'].includes(k)?'title':''}" title="${encode(p[k])}">${['Status','Level'].includes(k)?badge(p[k]):encode(p[k])}</td>`).join('')}<td><button class="btn small outline" data-act="${asset?'site':'event'}:${p.id}">详情</button> <button class="iconbtn" aria-label="编辑 ${encode(p.Title||p.Name)}" data-act="${asset?'site-edit':'event-edit'}:${p.id}">${svgIcon('pencil')}</button></td></tr>`).join('')||'<tr><td colspan="8">没有匹配记录，请清除筛选或登记新记录。</td></tr>'}</tbody></table></div><div class="pager"><label>每页<select id="grid-size">${[10,20,50,100,200].map(n=>`<option ${grid.size===n?'selected':''}>${n}</option>`).join('')}</select>条 · 共 ${rows.length} 条</label><div class="row">${control('上一页','page:-1','small outline')}<span>${grid.page} / ${pages}</span>${control('下一页','page:1','small outline')}</div></div></div>`;document.getElementById('grid-search').oninput=e=>{grid.find=e.target.value;grid.page=1;const pos=e.target.selectionStart;listing();const input=document.getElementById('grid-search');input.focus();input.setSelectionRange(pos,pos);};document.getElementById('grid-size').onchange=e=>{grid.size=Number(e.target.value);grid.page=1;listing();};}
function columnPicker(){showDialog('显示哪些列',`<div class="filter-list">${gridColumns().map(([k,v])=>`<label class="checkline"><input type="checkbox" value="${k}" ${grid.hidden.includes(k)?'':'checked'}>${v}</label>`).join('')}</div>${control('应用列选择','columns-apply','primary')}`);}
function valueFilter(key){const source=current==='assets'?data.sites:data.events.map(e=>({...e,Site:findSite(e.site)?.Name||'未分配站点'})),values=[...new Set(source.map(p=>String(p[key])))];showDialog('筛选'+gridColumns().find(c=>c[0]===key)[1],`<input id="value-query" aria-label="搜索候选值" placeholder="搜索候选值"><div class="toolbar">${control('全选','filter-all','small outline')}${control('全不选','filter-none','small outline')}</div><div class="filter-list">${values.map(v=>`<label class="checkline" data-value="${encode(v)}"><input type="checkbox" value="${encode(v)}" ${!grid.filters[key]||grid.filters[key].includes(v)?'checked':''}>${encode(v)}</label>`).join('')}</div>${control('应用筛选','filter-apply:'+key,'primary')}`);document.getElementById('value-query').oninput=e=>dialog.querySelectorAll('[data-value]').forEach(l=>l.hidden=!l.dataset.value.toLowerCase().includes(e.target.value.toLowerCase()));}

/* Detail and edit forms use stable local identifiers so display-name edits cannot break linkage. */
function siteDetail(id){const s=findSite(id);if(!s)return;showDialog(s.Name,`${badge(s.Status)}<dl class="detail-grid">${[['区域',s.Region],['负责人',s.Owner],['计算负载',s.Load+'%'],['响应延迟',s.Latency+' ms'],['算力容量',s.Capacity+' TFLOPS'],['关联事件',data.events.filter(e=>e.site===id).length+' 条']].map(([k,v])=>`<div><dt>${k}</dt><dd>${encode(v)}</dd></div>`).join('')}</dl><p class="detail-text">${encode(s.Description)}</p><div class="toolbar">${control('编辑站点','site-edit:'+id,'primary')}${control('查看关联事件','site-events:'+id,'outline')}${control('移除站点','site-delete:'+id,'danger')}</div>`);}
function eventDetail(id){const e=data.events.find(v=>v.id===id);if(!e)return;showDialog(e.Title,`${badge(e.Level)} ${badge(e.Status)}<dl class="detail-grid">${[['站点',findSite(e.site)?.Name||'未分配站点'],['负责人',e.Owner],['时间',e.Time]].map(([k,v])=>`<div><dt>${k}</dt><dd>${encode(v)}</dd></div>`).join('')}</dl><p class="detail-text">${encode(e.Details)}</p><div class="toolbar">${e.Status!=='已解决'?control(e.Status==='待处理'?'开始处置':'标记已解决','event-advance:'+id,'primary'):''}${control('编辑事件','event-edit:'+id,'outline')}${control('删除事件','event-delete:'+id,'danger')}</div>`);}
function siteForm(id){const s=findSite(id)||{Name:'',Region:'华东',Owner:'',Status:'正常',Load:20,Latency:30,Capacity:60,Description:''};if(dialog.open)dialog.close();showDialog(id?'编辑站点':'新增站点',`<form id="site-form"><div class="formgrid">${[['Name','站点名称'],['Region','区域'],['Owner','负责人']].map(([k,t])=>`<label>${t}<input name="${k}" value="${encode(s[k])}" required></label>`).join('')}<label>状态<select name="Status">${['正常','关注','告警','离线'].map(v=>`<option ${s.Status===v?'selected':''}>${v}</option>`).join('')}</select></label>${[['Load','负载 %'],['Latency','延迟 ms'],['Capacity','算力 TFLOPS']].map(([k,t])=>`<label>${t}<input name="${k}" type="number" step="any" min="0" ${k==='Load'?'max="100"':''} value="${s[k]}" required></label>`).join('')}<label class="wide">业务详情<textarea name="Description">${encode(s.Description)}</textarea></label></div><button class="btn primary" type="submit">保存站点</button></form>`);document.getElementById('site-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),next={...s,...f,id:id||'station-'+Date.now(),Load:Number(f.Load),Latency:Number(f.Latency),Capacity:Number(f.Capacity)};if(id)data.sites[data.sites.indexOf(s)]=next;else data.sites.push(next);record((id?'更新':'新增')+'站点：'+next.Name);dialog.close();paint();notice('站点已保存，空间网络和总览同步更新');};}
function eventForm(id){const e=data.events.find(e=>e.id===id)||{Title:'',site:data.sites[0]?.id||'',Level:'关注',Status:'待处理',Time:new Date().toLocaleString('sv-SE').slice(0,16),Owner:data.user?.name||'',Details:''};if(dialog.open)dialog.close();showDialog(id?'编辑事件':'登记事件',`<form id="event-form"><label>事件标题<input name="Title" value="${encode(e.Title)}" required></label><div class="formgrid"><label>所属站点<select name="site"><option value="">未分配站点</option>${data.sites.map(s=>`<option value="${s.id}" ${s.id===e.site?'selected':''}>${encode(s.Name)}</option>`).join('')}</select></label><label>等级<select name="Level">${['一般','关注','紧急'].map(v=>`<option ${v===e.Level?'selected':''}>${v}</option>`).join('')}</select></label><label>状态<select name="Status">${['待处理','处理中','已解决'].map(v=>`<option ${v===e.Status?'selected':''}>${v}</option>`).join('')}</select></label><label>负责人<input name="Owner" value="${encode(e.Owner)}" required></label><label class="wide">时间<input name="Time" value="${encode(e.Time)}" required></label><label class="wide">业务详情<textarea name="Details" required>${encode(e.Details)}</textarea></label></div><button class="btn primary" type="submit">保存事件</button></form>`);document.getElementById('event-form').onsubmit=event=>{event.preventDefault();const next={...e,...Object.fromEntries(new FormData(event.target)),id:id||'event-'+Date.now()};if(id)data.events[data.events.indexOf(e)]=next;else data.events.unshift(next);record((id?'更新':'登记')+'事件：'+next.Title);dialog.close();paint();notice('事件已保存，待处置统计已同步');};}
function history(){main.innerHTML=title('OPERATION LOG','每一步，都有迹可循',control('导出操作记录','history-export','outline'))+`<div class="panel">${data.history.map(h=>`<article class="logitem"><time>${encode(h.time)}</time><div><h3>${encode(h.message)}</h3><p>${encode(h.actor)}</p></div></article>`).join('')||'<div class="empty">还没有本地操作。新增、编辑或处置记录后，操作会出现在这里。</div>'}</div>`;}
function settings(){main.innerHTML=title('LOCAL WORKSPACE','备份与偏好')+`<div class="deck"><section class="panel"><h2>工作空间备份</h2><div class="toolbar">${control(svgIcon('file-down')+'导出工作空间','backup','primary')}<label class="btn outline">${svgIcon('import')}导入备份<input type="file" id="import-backup" accept=".json,application/json" hidden></label></div><details class="compact-help"><summary>备份说明</summary><p>备份包括当前站点、事件、操作记录、空间布局和本地账户。导入会替换当前工作空间；生成的原始 HTML 文件不会被原地改写。</p></details><div id="import-error" class="error" role="alert"></div></section><aside class="side-stack"><section class="panel teal"><h2>本地账户</h2><p style="margin-top:12px">${encode(data.user?.name||'当前使用本地观察席')}</p><div class="toolbar">${data.user?control('退出账户','logout','outline'):'<a class="btn outline" href="#/login">登录</a><a class="btn outline" href="#/register">注册</a>'}</div></section><section class="panel violet"><h2>空间动态</h2><div class="toolbar">${control(svgIcon(data.motion?'pause':'play')+(data.motion?'暂停旋转':'开启旋转'),'motion','outline')}</div><details class="compact-help"><summary>动效说明</summary><p>系统减少动态效果时自动停止自转。</p></details></section></aside></div>`;document.getElementById('import-backup').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.format!=='aurora-deck-1'||!Array.isArray(v.data.sites)||!Array.isArray(v.data.events)||!Array.isArray(v.data.accounts))throw Error('请选择极光数据态势导出的备份');if(!v.data.sites.every(s=>typeof s.Name==='string'&&Number.isFinite(s.Load)&&Number.isFinite(s.Capacity))||!v.data.events.every(e=>typeof e.Title==='string'&&typeof e.Details==='string'))throw Error('备份记录不完整');data={...fresh,...v.data};region='';record('导入工作空间备份');paint();notice('备份已导入');}catch(error){document.getElementById('import-error').textContent=error.message;}};}
function account(register=false){main.innerHTML=`<section class="auth"><div><div class="eyebrow">ENTER YOUR OBSERVATORY</div><h1>${register?'建立你的分析席位':'连接信息，\n看见全局。'.replace('\n','<br>')}</h1><p class="intro">${encode(seed.System.Intro)}</p><div class="auth-graphic">${network2d()}</div></div><div class="panel"><h2>${register?'注册本地账户':'登录工作空间'}</h2><form id="account-form">${register?'<label>名称<input name="name" required></label>':''}<label>账户<input name="user" required autocomplete="username" value="${register?'':'analyst'}"></label><label>密码<input name="password" type="password" required autocomplete="${register?'new-password':'current-password'}" value="${register?'':'aurora2026'}"></label><div class="error" id="auth-error" role="alert"></div><button class="btn primary" type="submit">${register?'创建本地账户':'进入态势台'} ${svgIcon('arrow-right')}</button></form><p class="account-link"><a href="#/${register?'login':'register'}">${register?'已有账户？返回登录':'创建自己的本地账户 ↗'}</a></p><div class="toolbar">${info()}</div></div></section>`;document.getElementById('account-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(register){if(data.accounts.some(a=>a.user===f.user)){document.getElementById('auth-error').textContent='本地账户已存在，可直接登录。';return;}data.accounts.push(f);save();location.hash='/login';notice('账户已创建，请使用刚设置的账户登录');}else{const a=data.accounts.find(a=>a.user===f.user&&a.password===f.password);if(!a){document.getElementById('auth-error').textContent='账户或密码与本地记录不一致。';return;}data.user={user:a.user,name:a.name};save();location.hash='/overview';}};}

/* All visible controls dispatch to a concrete local effect, data operation, navigation or explanation. */
document.addEventListener('click',e=>{const n=e.target.closest('[data-act]');if(n)handle(n.dataset.act,n);});
document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('svg [role=button]')){e.preventDefault();handle(e.target.dataset.act,e.target);}});
function handle(command,node){const [act,...parts]=command.split(':'),value=parts.join(':');switch(act){
case 'close':dialog.close();break;
case 'help':showDialog('使用说明',`<p>这里展示的是内嵌的离线演示快照，并非实时连接外部系统。总览指标、负载与事件来自当前站点记录；趋势使用独立的时段观测记录。</p><p>空间网络支持三维／二维切换，拖动空白旋转，滚轮缩放，方向键与 ＋／－ 键可控制相机。拖动标签可移动对应三维实体；重置布局恢复初始位置。</p><p>选择或悬停实体时突出直接关联；站点详情与事件明细可查看完整业务内容。表头支持排序、搜索候选值和多选筛选，显示列默认全开，每页数量为 10／20／50／100／200。</p><p>新增、编辑、处置、删除会同步图表和操作记录。账户只在本地有效；演示账户 analyst / aurora2026 已预填。备份用于转移浏览器里的修改，原 HTML 文件不会被原地改写。</p>`);break;
case 'licenses':showDialog('来源与许可',`<div class="licenses"><p>依据 <a href="https://github.com/jakubkrehel/skills">jakubkrehel/skills</a>（267330e）与 <a href="https://github.com/flornkm/skills">flornkm/skills</a>（cf1c009）的布局、颜色、可访问性和 WebGL 原则独立设计。</p><p>图标来自 <a href="https://github.com/Nexvyn/runeicons">Runeicons</a>，提交 f649e46，Apache-2.0。Copyright 2026 Runeicons。内嵌 SVG 仅作尺寸与 currentColor 适配。</p><p>所有站点、人员与事件均为虚构演示数据。资源已内嵌，打开这些来源链接才会访问外部站点。</p><details><summary>Apache-2.0 许可证全文</summary>${document.getElementById("license-copy").innerHTML}</details></div>`);break;
case 'dimension':view2d=!view2d;paint();break;
case 'reset':data.positions={};save();scene?.reset();if(view2d)paint();notice('空间布局已恢复');break;
case 'motion':data.motion=!data.motion;save();if(scene)scene.motion=data.motion;node.innerHTML=svgIcon(data.motion?'pause':'play')+(data.motion?'暂停旋转':'开启旋转');break;
case 'select':selectedSite=value;updateSelection();scene?.select(value);if(view2d&&document.getElementById('space')){const c=document.querySelector('#space svg');if(c)c.outerHTML=network2d();}break;
case 'site':siteDetail(value);break;
case 'site-new':siteForm();break;
case 'site-edit':siteForm(value);break;
case 'event':eventDetail(value);break;
case 'event-new':eventForm();break;
case 'event-edit':eventForm(value);break;
case 'site-events':{const s=findSite(value);if(dialog.open)dialog.close();grid.find='';grid.filters={Site:[s.Name]};grid.page=1;location.hash='/events';if(current==='events')listing();break;}
case 'event-advance':{const e=data.events.find(e=>e.id===value);e.Status=e.Status==='待处理'?'处理中':'已解决';record(e.Title+' → '+e.Status);dialog.close();paint();notice('事件状态已更新');break;}
case 'site-delete':case 'event-delete':{const s=act==='site-delete'?findSite(value):data.events.find(e=>e.id===value);dialog.close();showDialog('删除记录',`<p>删除 ${encode(s.Name||s.Title)}。${act==='site-delete'?'关联事件会保留，并改为未分配站点。':''}</p>${control('删除这条记录','delete-confirm:'+(act==='site-delete'?'site:':'event:')+value,'danger')}`);break;}
case 'delete-confirm':{const [type,id]=parts;if(type==='site'){const s=findSite(id);data.sites=data.sites.filter(s=>s.id!==id);data.events.forEach(e=>{if(e.site===id)e.site='';});delete data.positions[id];record('移除站点：'+s.Name);}else{const e=data.events.find(e=>e.id===id);data.events=data.events.filter(e=>e.id!==id);record('删除事件：'+e.Title);}dialog.close();paint();notice('记录已删除');break;}
case 'time':chosenTime=Number(value);if(current==='analysis')analysis();else{const p=seed.Trends[chosenTime];document.getElementById('chart-tip').textContent=`${p.Time} · 请求量 ${p.Requests} 次 · 延迟 ${p.Latency} ms`;}break;
case 'sort':grid.up=grid.sort===value?!grid.up:true;grid.sort=value;listing();break;
case 'columns':columnPicker();break;
case 'columns-apply':grid.hidden=[...dialog.querySelectorAll('input[type=checkbox]')].filter(i=>!i.checked).map(i=>i.value);dialog.close();listing();break;
case 'filter':valueFilter(value);break;
case 'filter-all':case 'filter-none':dialog.querySelectorAll('input[type=checkbox]').forEach(i=>i.checked=act==='filter-all');break;
case 'filter-apply':grid.filters[value]=[...dialog.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);grid.page=1;dialog.close();listing();break;
case 'grid-reset':grid.filters={};grid.find='';grid.page=1;listing();break;
case 'page':grid.page=Math.max(1,Math.min(Math.ceil(gridRows().length/grid.size)||1,grid.page+Number(value)));listing();break;
case 'grid-csv':{const columns=gridColumns().filter(([k])=>!grid.hidden.includes(k));csv('极光态势_'+(current==='assets'?'站点':'事件'),[columns.map(c=>c[1]),...gridRows().map(r=>columns.map(([k])=>r[k]))]);break;}
case 'trends-csv':csv('极光态势_时段快照',[['时间','请求量','延迟 ms'],...seed.Trends.slice(-range).map(p=>[p.Time,p.Requests,p.Latency])]);break;

function csv(name,rows){exportFile(name+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');}

/* AuroraSpace draws a true depth-tested 3D load network; it shares no runtime with another tool. */

/* Routing disposes just this deck's scene and keeps table state isolated when changing data types. */
function paint(){scene?.destroy();scene=null;shell();switch(current){case 'overview':overview();break;case 'space':spatial();break;case 'analysis':analysis();break;case 'events':case 'assets':listing();break;case 'history':history();break;case 'settings':settings();break;case 'login':account();break;case 'register':account(true);break;default:current='overview';overview();}}
function route(){const next=(location.hash.replace(/^#\/?/,'')||'overview').split('/')[0];if(next!==current&&['assets','events'].includes(next)){grid.hidden=[];if(!(next==='events'&&grid.filters.Site))grid.filters={};grid.find='';grid.page=1;grid.sort=next==='assets'?'Load':'Time';grid.up=false;}current=next;paint();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);route();
})();

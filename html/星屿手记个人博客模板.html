function auth(register=false){main.innerHTML=`<section class="auth"><div><div class="eyebrow">YOUR PRIVATE STUDIO</div><h1>${register?'从这里，开始记录':'欢迎回到<br>你的创作宇宙'}</h1><div class="visual" id="cosmos"></div></div><div class="panel"><h2>${register?'创建本地作者账户':'登录写作台'}</h2><form id="auth-form" style="margin-top:24px">${register?'<label>作者名称<input name="name" required></label>':''}<label>账户<input name="user" autocomplete="username" required value="${register?'':'writer'}"></label><label>密码<input type="password" name="password" autocomplete="${register?'new-password':'current-password'}" required value="${register?'':'star2026'}"></label><div class="error" id="auth-error" role="alert"></div><button class="btn primary" type="submit">${register?'创建账户':'进入写作台'} ${icon('arrow-right')}</button></form><p class="help">${register?'<a href="#/login">已有账户？返回登录</a>':'<a href="#/register">创建自己的本地账户 ↗</a>'}</p>${help()}</div></section>`;scene=new BlogCosmos(document.getElementById('cosmos'),true,[]);document.getElementById('auth-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),user=f.get('user'),password=f.get('password');if(register){if(state.accounts.some(a=>a.user===user)){document.getElementById('auth-error').textContent='该本地账户已存在，可以返回登录。';return;}state.accounts.push({user,password,name:f.get('name')});persist();location.hash='/login';toast('账户已创建，可使用刚设置的账户和密码登录');}else{const found=state.accounts.find(a=>a.user===user&&a.password===password);if(!found){document.getElementById('auth-error').textContent='账户或密码与本地记录不一致。';return;}state.user={user:found.user,name:found.name};persist();location.hash='/studio';}};}

/* The management grid owns its filters, columns, paging and exports; no other template uses it. */
const columns=[['Title','文章'],['Topic','主题'],['Date','日期'],['status','发布状态'],['Minutes','阅读分钟'],['Views','阅读次数']];
function matchingRows(){return state.posts.filter(p=>(!table.search||Object.values(p).join(' ').toLowerCase().includes(table.search.toLowerCase()))&&columns.every(([k])=>!table.filters[k]||table.filters[k].includes(String(p[k])))).sort((a,b)=>{let v=typeof a[table.sort]==='number'?a[table.sort]-b[table.sort]:String(a[table.sort]).localeCompare(String(b[table.sort]),'zh');return table.ascending?v:-v;});}
function statusText(v){return v==='published'?'已发布':v==='draft'?'草稿':v;}
function studio(){if(!state.user){location.hash='/login';return;}const rows=matchingRows(),max=Math.max(1,Math.ceil(rows.length/table.size));table.page=Math.min(table.page,max);main.innerHTML=heading('AUTHOR CONSOLE',state.user.name+'的写作台',`<a class="btn primary" href="#/edit/new">${icon('plus')}写一篇</a>`)+`<div class="stats"><div class="stat">全部文章<b>${state.posts.length}</b></div><div class="stat">已发布<b>${publicPosts().length}</b></div><div class="stat">总阅读次数<b>${state.posts.reduce((s,p)=>s+p.Views,0)}</b></div></div><div class="toolbar"><input aria-label="搜索写作台" id="table-search" class="search" placeholder="搜索标题、正文、主题…" value="${esc(table.search)}">${button(icon('columns-3')+'显示列','columns','outline small')}${button(icon('file-down')+'导出 CSV','csv','outline small')}${button('清除筛选','table-reset','outline small')}${button('退出账户','logout','outline small')}</div><div class="table-wrap"><table><thead><tr>${columns.filter(([k])=>!table.hidden.includes(k)).map(([k,v])=>`<th><div class="head"><button data-action="sort:${k}" aria-label="按${v}排序">${v} ${table.sort===k?(table.ascending?'↑':'↓'):'↕'}</button><button data-action="filter:${k}" aria-label="筛选${v}">${table.filters[k]?'●':'▾'}</button></div></th>`).join('')}<th>操作</th></tr></thead><tbody>${rows.slice((table.page-1)*table.size,table.page*table.size).map(p=>`<tr>${columns.filter(([k])=>!table.hidden.includes(k)).map(([k])=>`<td class="${k==='Title'?'title-cell':''}" title="${esc(statusText(p[k]))}">${esc(statusText(p[k]))}</td>`).join('')}<td><a class="btn small outline" href="#/edit/${p.id}">编辑</a> <a class="btn small outline" href="#/read/${p.id}">查看</a> <button class="iconbtn" aria-label="删除 ${esc(p.Title)}" data-action="delete:${p.id}">${icon('trash-2')}</button></td></tr>`).join('')||'<tr><td colspan="7">没有匹配记录，清除筛选可查看其它文章。</td></tr>'}</tbody></table></div><div class="pager"><label class="row">每页<select id="page-size">${[10,20,50,100,200].map(n=>`<option ${n===table.size?'selected':''}>${n}</option>`).join('')}</select>条，共 ${rows.length} 条</label><div class="row">${button('上一页','page:-1','small outline')}<span>${table.page} / ${max}</span>${button('下一页','page:1','small outline')}</div></div>`;document.getElementById('table-search').oninput=e=>{table.search=e.target.value;table.page=1;const pos=e.target.selectionStart;studio();let i=document.getElementById('table-search');i.focus();i.setSelectionRange(pos,pos);};document.getElementById('page-size').onchange=e=>{table.size=Number(e.target.value);table.page=1;studio();};}
function columnDialog(){openDialog('选择显示列',`<div class="filter-values">${columns.map(([k,v])=>`<label class="checkline"><input type="checkbox" value="${k}" ${table.hidden.includes(k)?'':'checked'}>${v}</label>`).join('')}</div>${button('应用','columns-apply','primary')}`);}
function filterDialog(key){const values=[...new Set(state.posts.map(p=>String(p[key])))];openDialog('筛选'+columns.find(c=>c[0]===key)[1],`<input id="value-search" placeholder="搜索候选值" aria-label="搜索候选值"><div class="row" style="margin-top:12px">${button('全选','filter-all','small outline')}${button('全不选','filter-none','small outline')}</div><div class="filter-values" id="filter-values">${values.map(v=>`<label class="checkline" data-value="${esc(v)}"><input type="checkbox" value="${esc(v)}" ${!table.filters[key]||table.filters[key].includes(v)?'checked':''}>${esc(statusText(v))}</label>`).join('')}</div>${button('应用筛选','filter-apply:'+key,'primary')}`);document.getElementById('value-search').oninput=e=>dlg.querySelectorAll('[data-value]').forEach(l=>l.hidden=!statusText(l.dataset.value).toLowerCase().includes(e.target.value.toLowerCase()));}

/* Article creation and edits update the same records used by archive, reader, charts and bookmarks. */
function edit(id){if(!state.user){location.hash='/login';return;}const p=id==='new'?{id:'new',Title:'',Topic:topics()[0]||'手记',Date:new Date().toLocaleDateString('sv-SE'),Summary:'',Body:'',Minutes:5,Views:0,status:'draft'}:state.posts.find(p=>p.id===id);if(!p){location.hash='/studio';return;}main.innerHTML=`<section class="editor">${heading('WRITING ROOM',id==='new'?'写下新的灵感':'继续这篇手记','<a class="btn outline" href="#/studio">返回写作台</a>')}<form id="editor-form"><div class="form-grid"><label class="wide">标题<input name="Title" value="${esc(p.Title)}" required></label><label>主题<input name="Topic" value="${esc(p.Topic)}" required list="topics"><datalist id="topics">${topics().map(t=>`<option>${esc(t)}</option>`).join('')}</datalist></label><label>日期<input name="Date" type="date" value="${esc(p.Date)}" required></label><label class="wide">摘要<input name="Summary" value="${esc(p.Summary)}" required></label><label class="wide">正文<textarea name="Body" required>${esc(p.Body)}</textarea></label><label>预计阅读分钟<input name="Minutes" type="number" value="${p.Minutes}" min="1" step="1" required></label><label>发布状态<select name="status"><option value="draft" ${p.status==='draft'?'selected':''}>草稿</option><option value="published" ${p.status==='published'?'selected':''}>已发布</option></select></label></div><button type="submit" class="btn primary">${icon('save')}保存文章</button></form></section>`;document.getElementById('editor-form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),next={...p,...f,Minutes:Number(f.Minutes),id:id==='new'?'story-'+Date.now():id};if(id==='new')state.posts.push(next);else state.posts[state.posts.indexOf(p)]=next;persist();location.hash='/studio';toast(next.status==='published'?'文章已发布，已加入归档与星图':'草稿已保存');};}
function about(){main.innerHTML=heading('THE PERSON BEHIND THE PIXELS','关于这座小岛')+`<div class="profile-band" style="margin-top:0"><div><div class="avatar">${esc(seed.Profile.Name.slice(0,1))}</div><h2 style="margin-top:22px">${esc(seed.Profile.Name)}</h2><p>${esc(seed.Profile.Role)}</p><div class="eyebrow" style="margin-top:22px">${esc(seed.Profile.Location)}</div></div><div><h2>${esc(seed.Profile.Headline)}</h2><p style="margin-top:22px;white-space:pre-wrap">${esc(seed.Profile.Bio)}</p><div class="note">${esc(seed.Profile.Note)}</div><a class="btn primary" href="#/archive">读我的文章 ${icon('arrow-right')}</a></div></div><div class="split" style="margin-top:25px"><div class="panel rose"><h2>写作中的三个坐标</h2><div class="stats">${topics().map(t=>`<div><h3>${esc(t)}</h3><p>${publicPosts().filter(p=>p.Topic===t).length} 篇文章</p></div>`).join('')}</div></div><div class="panel green">${topicChart()}</div></div>`;}
function settings(){main.innerHTML=heading('KEEP YOUR ISLAND','备份与偏好')+`<div class="split"><div class="panel"><h2>给创作留一份副本</h2><div class="toolbar">${button(icon('file-down')+'导出博客备份','backup','primary')}<label class="btn outline">${icon('import')}导入博客备份<input id="restore" type="file" accept=".json,application/json" hidden></label></div><details class="compact-help"><summary>备份说明</summary><p>备份包含文章、收藏、评论及本地账户。导入将替换当前博客记录；原始 HTML 文件保持生成时的内容。</p></details><div class="error" id="restore-error" role="alert"></div></div><aside class="panel rose"><h2>星体自转</h2><div class="toolbar">${button(icon(state.motion?'pause':'play')+(state.motion?'暂停自转':'开启自转'),'motion','outline')}</div><details class="compact-help"><summary>动效说明</summary><p>跟随系统的减少动态效果偏好。</p></details></aside></div>`;document.getElementById('restore').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.format!=='star-isle-1'||!Array.isArray(v.state.posts)||!Array.isArray(v.state.accounts))throw Error('请选择由此博客导出的备份文件');if(!v.state.posts.every(p=>['Title','Topic','Date','Summary','Body'].every(k=>typeof p[k]==='string')&&Number.isFinite(p.Minutes)&&Number.isFinite(p.Views)))throw Error('备份中的文章内容不完整');state={...initial,...v.state};persist();render();toast('博客备份已导入');}catch(error){document.getElementById('restore-error').textContent=error.message;}};}

/* A single delegated action path dispatches only Star Isle controls and restores chart state as needed. */
document.addEventListener('click',event=>{const node=event.target.closest('[data-action]');if(!node)return;action(node.dataset.action,node);});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('svg [role=button]')){event.preventDefault();action(event.target.dataset.action,event.target);}});
function action(command,node){const [name,...rest]=command.split(':'),value=rest.join(':');switch(name){
case 'close':dlg.close();break;
case 'help':openDialog('这座小岛怎么使用',`<p>文章归档可搜索正文、按主题筛选；收藏保存在当前浏览器。作者写作台可创建、编辑、删除文章和管理发布状态。</p><p>灵感星图是真实三维场景，支持拖动旋转、滚轮缩放、选择文章；方向键及 ＋／－ 键也可控制。二维主题轨道可直接筛选文章。</p><p>此页面完全离线。演示作者为 writer，密码为 star2026，登录页已预填。注册、评论和备份均只作用于本地，不发送到服务器。</p><p>说明按钮默认收起。浏览器清理数据前请在备份页导出；本地编辑不会原地改写原始 HTML。</p>`);break;
case 'licenses':openDialog('来源与许可',`<div class="licenses"><p>界面设计依据 <a href="https://github.com/jakubkrehel/skills">jakubkrehel/skills</a>（267330e）与 <a href="https://github.com/flornkm/skills">flornkm/skills</a>（cf1c009）。</p><p>图标采用 <a href="https://github.com/Nexvyn/runeicons">Runeicons</a>，提交 f649e46，Apache-2.0。Copyright 2026 Runeicons。SVG 仅作 currentColor 与尺寸适配。</p><p>本博客为独立实现；默认文章与作者资料均为虚构演示内容。所有图标、样式和三维实现已内嵌，打开来源链接才会访问外部站点。</p><details><summary>Apache-2.0 许可证全文</summary>${document.getElementById("license-copy").innerHTML}</details></div>`);break;
case 'tag':tag=value;archive(route==='library');break;
case 'topic-open':tag=value;search='';location.hash='/archive';break;
case 'save':if(state.saved.includes(value))state.saved=state.saved.filter(id=>id!==value);else state.saved.push(value);persist();toast(state.saved.includes(value)?'已收藏文章':'已取消收藏');if(route==='library')archive(true);else{node.setAttribute('aria-pressed',state.saved.includes(value));node.innerHTML=icon(state.saved.includes(value)?'check':'bookmark')+(route==='read'?(state.saved.includes(value)?'已收藏':'收藏文章'):'');node.setAttribute('aria-label',state.saved.includes(value)?'取消收藏':'收藏文章');}break;
case 'article-export':{const p=state.posts.find(p=>p.id===value);download(p.Title+'.txt',p.Title+'\n\n'+p.Summary+'\n\n'+p.Body,'text/plain');break;}
case 'select-story':atlasSelection=state.posts.find(p=>p.id===value);updateSelected();scene?.select(value);break;
case 'reset-scene':scene?.reset();break;
case 'motion':state.motion=!state.motion;persist();if(scene)scene.motion=state.motion;node.innerHTML=icon(state.motion?'pause':'play')+(state.motion?'暂停自转':'开启自转');break;
case 'logout':state.user=null;persist();location.hash='/login';break;
case 'delete':{const p=state.posts.find(p=>p.id===value);openDialog('删除文章',`<p>删除《${esc(p.Title)}》后，它也会从归档、星图和收藏中移除。</p>${button('删除这篇文章','delete-confirm:'+value,'danger')}`);break;}
case 'delete-confirm':state.posts=state.posts.filter(p=>p.id!==value);state.saved=state.saved.filter(id=>id!==value);state.comments=state.comments.filter(c=>c.post!==value);persist();dlg.close();studio();toast('文章已删除');break;
case 'sort':table.ascending=table.sort===value?!table.ascending:true;table.sort=value;studio();break;
case 'columns':columnDialog();break;
case 'columns-apply':table.hidden=[...dlg.querySelectorAll('input[type=checkbox]')].filter(i=>!i.checked).map(i=>i.value);dlg.close();studio();break;
case 'filter':filterDialog(value);break;
case 'filter-all':case 'filter-none':dlg.querySelectorAll('input[type=checkbox]').forEach(i=>i.checked=name==='filter-all');break;
case 'filter-apply':table.filters[value]=[...dlg.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);table.page=1;dlg.close();studio();break;
case 'table-reset':table.filters={};table.search='';table.page=1;studio();break;
case 'page':table.page=Math.max(1,Math.min(Math.ceil(matchingRows().length/table.size)||1,table.page+Number(value)));studio();break;
case 'csv':{const c=columns.filter(([k])=>!table.hidden.includes(k)),cell=v=>'"'+String(v).replace(/"/g,'""')+'"';download('星屿手记_文章.csv','\ufeff'+[c.map(x=>x[1]),...matchingRows().map(p=>c.map(([k])=>statusText(p[k])))].map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv');break;}
case 'backup':download('星屿手记_备份.json',JSON.stringify({format:'star-isle-1',state},null,2));break;
}}

/* BlogCosmos owns one lightweight WebGL context and one visibility-aware 30 fps loop. */
class BlogCosmos{
constructor(host,compact,posts,onSelect=()=>{}){this.host=host;this.compact=compact;this.posts=posts;this.onSelect=onSelect;this.yaw=.35;this.pitch=-.25;this.zoom=4.6;this.motion=state.motion;this.live=true;this.visible=true;this.last=0;this.selected=posts[0]?.id;this.drag=null;this.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;this.canvas=document.createElement('canvas');this.canvas.tabIndex=0;this.canvas.setAttribute('aria-label',compact?'三维星体，方向键旋转，加减键缩放':'三维文章星图，方向键旋转，加减键缩放，文章按钮可选中');host.prepend(this.canvas);this.gl=this.canvas.getContext('webgl',{alpha:true,antialias:true});
if(!this.gl){this.fallback();return;}try{this.init();}catch{this.fallback();return;}
this.canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();if(this.live)this.fallback();});this.observer=new ResizeObserver(()=>this.draw());this.observer.observe(host);this.intersection=new IntersectionObserver(entries=>{this.visible=entries[0].isIntersecting;});this.intersection.observe(host);
this.canvas.onpointerdown=e=>{this.drag={x:e.clientX,y:e.clientY};this.canvas.setPointerCapture(e.pointerId);};this.canvas.onpointermove=e=>{if(!this.drag)return;this.yaw+=(e.clientX-this.drag.x)*.007;this.pitch=Math.max(-1.25,Math.min(1.25,this.pitch+(e.clientY-this.drag.y)*.005));this.drag={x:e.clientX,y:e.clientY};this.draw();};this.canvas.onpointerup=()=>this.drag=null;this.canvas.onpointercancel=()=>this.drag=null;this.canvas.onwheel=e=>{e.preventDefault();this.zoom=Math.max(2.7,Math.min(8,this.zoom+e.deltaY*.004));this.draw();};this.canvas.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')this.yaw-=.13;if(e.key==='ArrowRight')this.yaw+=.13;if(e.key==='ArrowUp')this.pitch-=.1;if(e.key==='ArrowDown')this.pitch+=.1;if(e.key==='+'||e.key==='=')this.zoom=Math.max(2.7,this.zoom-.3);if(e.key==='-')this.zoom=Math.min(8,this.zoom+.3);this.draw();}};
this.labels=document.createElement('div');this.labels.className='node-labels';host.append(this.labels);posts.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.Topic+' · '+p.Title;b.title=p.Title;b.onclick=()=>{this.select(p.id);onSelect(p);};b.setAttribute('aria-label','选择文章 '+p.Title);this.labels.append(b);});this.tick();}
/* Recover a readable non-WebGL state without presenting a flat graphic as live 3D. */
fallback(){this.live=false;this.labels?.remove();this.canvas.remove();this.host.insertAdjacentHTML('afterbegin','<div class="fallback"><h3>三维绘制暂不可用</h3><p>文章与二维主题图仍可完整使用。</p><a class="btn outline" href="#/archive">前往文章归档</a></div>');}
/* Compile the private shader, then precompute the sculpted sphere, orbit rings and article anchors. */
init(){const gl=this.gl,vs=`attribute vec3 p;attribute vec3 n;uniform vec2 rot;uniform float aspect;uniform float zoom;uniform mediump float kind;varying vec3 normal;varying vec3 point;void main(){float c=cos(rot.x),s=sin(rot.x),a=cos(rot.y),b=sin(rot.y);mat3 ry=mat3(c,0.,-s,0.,1.,0.,s,0.,c);mat3 rx=mat3(1.,0.,0.,0.,a,b,0.,-b,a);vec3 q=rx*ry*p;normal=rx*ry*n;point=q;float z=zoom-q.z;gl_Position=vec4(q.x*2.7/aspect,q.y*2.7,z*1.004-.2004,z);gl_PointSize=kind>1.5?5.:2.;}`,fs=`precision mediump float;varying vec3 normal;varying vec3 point;uniform mediump float kind;void main(){if(kind>1.5){vec2 d=gl_PointCoord-.5;if(length(d)>.5)discard;gl_FragColor=vec4(.9,1.,.6,.95);return;}if(kind>.5){gl_FragColor=vec4(.85,.6,.85,.30);return;}vec3 n=normalize(normal);float rim=pow(1.-abs(n.z),2.);float lit=max(0.,dot(n,normalize(vec3(-.6,.9,1.))));vec3 a=mix(vec3(.10,.055,.17),vec3(.85,.42,.58),lit*.9);a+=vec3(.45,.65,.8)*rim*.8;a+=vec3(.65,.85,.3)*pow(max(0.,dot(n,normalize(vec3(.7,-.2,1.)))),22.);gl_FragColor=vec4(a,1.);}`;
const compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};this.program=gl.createProgram();gl.attachShader(this.program,compile(gl.VERTEX_SHADER,vs));gl.attachShader(this.program,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(this.program);if(!gl.getProgramParameter(this.program,gl.LINK_STATUS))throw Error('WebGL link');gl.useProgram(this.program);this.loc={p:gl.getAttribLocation(this.program,'p'),n:gl.getAttribLocation(this.program,'n'),rot:gl.getUniformLocation(this.program,'rot'),aspect:gl.getUniformLocation(this.program,'aspect'),zoom:gl.getUniformLocation(this.program,'zoom'),kind:gl.getUniformLocation(this.program,'kind')};
const sphere=[],normals=[],coord=(u,v)=>{const f=1+.075*Math.sin(u*7+v*3);return [Math.cos(u)*Math.sin(v)*f,Math.cos(v)*f,Math.sin(u)*Math.sin(v)*f];};for(let i=0;i<48;i++)for(let j=0;j<24;j++){const a=i/48*2*Math.PI,b=j/24*Math.PI,du=2*Math.PI/48,dv=Math.PI/24;for(const [u,v]of [[a,b],[a+du,b],[a,b+dv],[a,b+dv],[a+du,b],[a+du,b+dv]]){const p=coord(u,v);sphere.push(...p);normals.push(...p);}}this.sphere=this.buffer(sphere,normals);

}

/* Route transitions dispose the old GPU context and preserve only purposeful business state. */
function render(){scene?.destroy();scene=null;const parts=(location.hash.replace(/^#\/?/,'')||'home').split('/');route=parts[0];chrome();switch(route){case 'home':home();break;case 'archive':archive();break;case 'library':archive(true);break;case 'read':read(parts[1]);break;case 'atlas':atlas();break;case 'about':about();break;case 'studio':studio();break;case 'edit':edit(parts[1]);break;case 'settings':settings();break;case 'login':auth();break;case 'register':auth(true);break;default:location.hash='/home';}window.scrollTo(0,0);}
